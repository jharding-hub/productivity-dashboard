<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background: rounded square tile, dark dashboard color -->
  <rect width="512" height="512" rx="96" ry="96" fill="#1a1a1a"/>
  
  <!-- Subtle outer glow ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#d4a853" stroke-width="2" opacity="0.18"/>
  
  <!-- Outer wheel rim -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#d4a853" stroke-width="10"/>
  
  <!-- 8 spokes radiating from inner hub to outer rim -->
  <g transform="translate(256 256)" stroke="#d4a853" stroke-width="9" stroke-linecap="round">
    <line x1="0" y1="-175" x2="0" y2="-72"/>
    <line x1="0" y1="-175" x2="0" y2="-72" transform="rotate(45)"/>
    <line x1="0" y1="-175" x2="0" y2="-72" transform="rotate(90)"/>
    <line x1="0" y1="-175" x2="0" y2="-72" transform="rotate(135)"/>
    <line x1="0" y1="-175" x2="0" y2="-72" transform="rotate(180)"/>
    <line x1="0" y1="-175" x2="0" y2="-72" transform="rotate(225)"/>
    <line x1="0" y1="-175" x2="0" y2="-72" transform="rotate(270)"/>
    <line x1="0" y1="-175" x2="0" y2="-72" transform="rotate(315)"/>
  </g>
  
  <!-- Inner hub housing (dark with yellow border) -->
  <circle cx="256" cy="256" r="62" fill="#1a1a1a" stroke="#d4a853" stroke-width="8"/>
  
  <!-- Centerpost: solid yellow dot at center -->
  <circle cx="256" cy="256" r="26" fill="#d4a853"/>
  
  <!-- Tiny inner accent for depth -->
  <circle cx="256" cy="256" r="10" fill="#1a1a1a"/>
</svg>
