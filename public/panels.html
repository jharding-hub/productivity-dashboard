<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Centerpost panels</title>
<script src="config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<style>
:root{
--text-primary:#1a1a1a;--text-secondary:#5f5e5a;--text-muted:#8a8880;--border:#e4e2da;
--surface-0:#faf9f6;--surface-1:#f1efe8;--surface-2:#ffffff;--radius:8px;
--err:#b3261e;--ok:#0F6E56;
}
@media (prefers-color-scheme: dark){
:root{
--text-primary:#f1efe8;--text-secondary:#c2c0b6;--text-muted:#8a8880;--border:#3a3937;
--surface-0:#1c1c1a;--surface-1:#26251f;--surface-2:#2c2b26;
--err:#f0997b;--ok:#5DCAA5;
}
}
*{box-sizing:border-box}
body{margin:0;background:var(--surface-0);color:var(--text-primary);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.page{max-width:760px;margin:0 auto;padding:2.5rem 1.5rem 4rem}
.nav-link{margin:0 0 10px}
.nav-link a{font-size:12px;color:var(--text-muted);text-decoration:none}
.nav-link a:hover{color:var(--text-secondary)}
.page-header{margin-bottom:1.75rem}
.page-header h1{font-size:22px;font-weight:500;margin:0 0 6px}
.page-header p{font-size:14px;color:var(--text-secondary);margin:0}
.lane{margin-bottom:22px}
.lane-label{font-size:12px;font-weight:500;color:var(--text-muted);margin:0 0 8px}
.panel-list{display:flex;flex-direction:column;gap:8px}
.panel-empty{font-size:13px;color:var(--text-muted);margin:0;padding:14px 12px;border:1px dashed var(--border);border-radius:var(--radius)}
.page-footer{margin-top:2.5rem;padding-top:1rem;border-top:1px solid var(--border);font-size:12px;color:var(--text-muted)}
.signin-overlay{position:fixed;inset:0;z-index:999;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,0.45);backdrop-filter:blur(3px)}
.signin-card{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:24px 22px;width:280px;box-shadow:0 8px 30px rgba(0,0,0,0.25)}
.signin-title{font-size:15px;font-weight:500;color:var(--text-primary);margin-bottom:2px}
.signin-sub{font-size:12px;color:var(--text-secondary);margin-bottom:16px}
.signin-card input{width:100%;box-sizing:border-box;margin-bottom:10px;padding:9px 10px;background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius);color:var(--text-primary);font-size:13px;font-family:inherit}
.signin-card button{width:100%;padding:9px 0;background:var(--text-primary);border:none;border-radius:var(--radius);color:var(--surface-0);font-weight:500;font-size:13px;cursor:pointer;font-family:inherit}
.signin-err{color:var(--err);font-size:11px;margin-top:8px;min-height:14px}
.item{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface-2);overflow:hidden}
.item-summary{list-style:none;cursor:pointer;padding:10px 12px;display:flex;align-items:flex-start;gap:8px}
.item-summary::-webkit-details-marker{display:none}
.item-chevron{display:inline-block;color:var(--text-muted);font-size:10px;flex-shrink:0;margin-top:3px;transition:transform .15s}
.item-chevron::before{content:'\25B8'}
.item[open] .item-chevron{transform:rotate(90deg)}
.item-title-wrap{display:flex;flex-direction:column;gap:2px;min-width:0}
.item-title{font-size:13px;font-weight:500;color:var(--text-primary)}
.item-source{font-size:11px;color:var(--text-muted)}
.item-body{padding:0 14px 14px 34px}
.detail-section-label{font-size:12px;font-weight:500;color:var(--text-muted);margin:10px 0 4px}
.detail-text{font-size:13px;line-height:1.6;color:var(--text-primary);margin:0}
.detail-list{margin:4px 0 0;padding-left:18px;font-size:13px;line-height:1.6;color:var(--text-secondary)}
.item-footer{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.item-chip{font-size:11px;color:var(--text-muted);background:var(--surface-1);border:1px solid var(--border);border-radius:6px;padding:3px 8px}
.item.completed{opacity:.55}
.item-completed-badge{display:block;font-size:11px;color:var(--ok);margin-top:2px}
.completed-divider{font-size:11px;font-weight:500;color:var(--text-muted);margin:14px 0 8px;text-transform:uppercase;letter-spacing:.03em}
</style>
</head>
<body>
<div class="page">
<p class="nav-link"><a href="architecture.html">&larr; Architecture</a></p>
<div class="page-header">
<h1>Centerpost panels</h1>
<p>Recommendations, decisions, and work from design reviews. Owner-only.</p>
</div>
<div class="lane">
<p class="lane-label">Recommendations</p>
<div class="panel-list" id="list-recommendations"><p class="panel-empty">Nothing here yet.</p></div>
</div>
<div class="lane">
<p class="lane-label">Decisions</p>
<div class="panel-list" id="list-decisions"><p class="panel-empty">Nothing here yet.</p></div>
</div>
<div class="lane">
<p class="lane-label">Work</p>
<div class="panel-list" id="list-work"><p class="panel-empty">Nothing here yet.</p></div>
</div>
<div class="page-footer">Centerpost panels. Populated after design reviews — see CLAUDE.md.</div>
</div>
<script>
var OWNER_EMAIL='medicjth@gmail.com';
if(typeof firebase!=='undefined'&&typeof CENTERPOST_FIREBASE_CONFIG!=='undefined'){
firebase.initializeApp(CENTERPOST_FIREBASE_CONFIG);
}
function showSignIn(msg){
var ov=document.getElementById('panels-signin');
if(!ov){
ov=document.createElement('div');
ov.id='panels-signin';
ov.className='signin-overlay';
ov.innerHTML=
'<form id="panels-signin-form" class="signin-card">'+
'<div class="signin-title">Centerpost panels</div>'+
'<div class="signin-sub">Owner sign-in required</div>'+
'<input id="psi-email" type="email" placeholder="Email" autocomplete="username" required>'+
'<input id="psi-pass" type="password" placeholder="Password" autocomplete="current-password" required>'+
'<button type="submit">Sign in</button>'+
'<div id="psi-err" class="signin-err"></div>'+
'</form>';
document.body.appendChild(ov);
document.getElementById('panels-signin-form').addEventListener('submit',async function(e){
e.preventDefault();
var err=document.getElementById('psi-err');
err.textContent='';
try{
await firebase.auth().signInWithEmailAndPassword(
document.getElementById('psi-email').value.trim(),
document.getElementById('psi-pass').value
);
}catch(ex){
err.textContent=ex.message||'Sign-in failed';
}
});
}
if(msg)document.getElementById('psi-err').textContent=msg;
ov.style.display='flex';
}
function hideSignIn(){
var ov=document.getElementById('panels-signin');
if(ov)ov.style.display='none';
}
function requireOwner(){
return new Promise(function(resolve){
firebase.auth().onAuthStateChanged(function(user){
if(user&&!user.isAnonymous&&user.email&&user.email.toLowerCase()===OWNER_EMAIL){
hideSignIn();
resolve(user);
}else if(user&&!user.isAnonymous){
firebase.auth().signOut().catch(function(){});
showSignIn('Not authorized for this account.');
}else{
if(user&&user.isAnonymous)firebase.auth().signOut().catch(function(){});
showSignIn();
}
});
});
}
var panelData=[
{id:'r10-complication',panel:'work',title:'R10 — watch face Timer complication: confirm on-device',source:'Senior design review 2026-07-28 · R10, built 2026-07-31',description:'The WidgetKit complication for the Focus Timer is built and compiles clean (BUILD SUCCEEDED, correctly embedded in both bundle locations), but has never actually run on a real watch face.',steps:['Run centerpost-sync, then Xcode Archive, then TestFlight','Open Signing & Capabilities for the new CenterpostWatchComplication target (and re-check the watch app’s) — new App Groups don’t always self-provision','Add the complication to a real watch face from the Watch app, or by long-pressing the face','Start a Focus Timer and confirm the complication counts down live','Let it finish or reset it, confirm it reverts to Idle'],model:'Sonnet 5',effort:'Low — verification only, code already exists',status:'completed',completedAt:'2026-08-04'},
{id:'r7-archive-sweep',panel:'work',title:'R7 Ship-3 — confirm reminder archive auto-sweep on a real device',source:'Senior design review 2026-07-28 · R7 Ship-3, shipped native build 57',description:'Reminders older than 7 days should auto-archive on the daily rollover tick. Verified against boundary-exact test data and the sync-merge suite, but never actually triggered on a real device — no reminder old enough existed at the time.',steps:['Find or create a reminder with a due date more than 7 days in the past','Let the app sit through a day rollover, or fake the device date forward a day','Confirm it lands in the collapsed "Archived" folder, not still in the live list'],model:'Sonnet 5',effort:'Low — on-device check only, no new code',status:'open',completedAt:null},
{id:'988-threshold',panel:'decisions',title:'Is the 988 crisis-line trigger (3 resets/hour) right for shift workers?',source:'Persona panel 3, 2026-08-02 — surfaced, not decided',description:'The breathwork-frequency safety net shows one dismissible 988 line after 3 resets in a rolling hour. The ER-nurse persona flagged that 3 resets/hr can be normal for someone mid-shift — the net could fire on people who aren’t in crisis.',steps:['Decide: leave the threshold as-is, raise it, or make it context-aware','Tell me the call whenever — this isn’t blocking anything'],status:'open',completedAt:null},
{id:'r13-copy-pass',panel:'recommendations',title:'Copywriting pass on R13’s first-draft subtitle/hint text',source:'Senior design review 2026-07-28 · R13, shipped 2026-07-30',description:'R13 added plain-language subtitles to HALT+/Urge Log and empty-state hints. The report flagged the wording as a first draft, not final copy.',steps:['Pull the current strings — HALT+/Urge Log subtitles, Tasks/Notes empty-state text','Tighten the wording together','Ship as a small web-only text change'],model:'Sonnet 5',effort:'Low — text-only, no logic touched',status:'open',completedAt:null},
{id:'app-store-submission-prep',panel:'recommendations',title:'Prep and submit the App Store Connect listing',source:'Based on your App Store direction decision — Persona panel 3, 2026-08-02',description:'Persona panel 3’s direction answer made the App Store the front door for launch (native-first, web stays a companion). Submission itself — listing, compliance, age rating — hasn’t started yet.',steps:['Confirm Info.plist has ITSAppUsesNonExemptEncryption=false — App Store Connect blocks the build on the compliance question otherwise (known gotcha, see CLAUDE.md)','Draft the listing: description, keywords, promotional text, screenshots per required device size','Fill out the App Privacy “nutrition label” in App Store Connect — what’s collected (account email, task/journal/mood data in Firestore) and why','Set the age rating honestly — flag the crisis-resource (988) and breathwork content in the questionnaire rather than answering as if this were a plain productivity app','Submit for review'],model:'Sonnet 5',effort:'Medium — I can draft the listing copy and check the compliance flag; the submission itself is you, in App Store Connect',status:'open',completedAt:null},
{id:'privacy-policy-page',panel:'recommendations',title:'Publish a privacy policy page',source:'Based on your App Store direction decision — Persona panel 3, 2026-08-02 (Need Level 2)',description:'App Store Connect requires a working Privacy Policy URL before it accepts a submission. Persona panel 3 flagged this as still missing — it was a "nice to have" before, the App Store decision makes it a hard blocker.',steps:['Draft a plain-language policy: what’s collected (email, tasks/journal/mood in Firestore), what’s never shared, how account deletion works (link the existing /account/delete flow)','Publish as a static page — public/privacy.html, same pattern as architecture.html/ops.html','Add the URL to App Store Connect’s submission form'],model:'Sonnet 5',effort:'Low-Medium — mostly drafting text plus one new static page; the deletion mechanics already exist and just need describing',status:'open',completedAt:null},
{id:'native-touch-face-id',panel:'work',title:'Face ID/Touch ID sign-in on native (iPhone, iPad, and the Mac-hosted app)',source:'Follow-up to Touch ID sign-in (web/Mac browser), shipped 2026-08-05',description:'Touch ID sign-in works today in a Mac browser at centerpost.app — Settings → Touch ID sign-in. Native (the TestFlight app, including running as an iPad app on Apple Silicon) is a real gap, not a smaller version of the same fix: a WKWebView\'s navigator.credentials calls do not reach the system passkey UI at all, with or without the origin fixed, so this needs an actual native Swift call (AuthenticationServices), not JS. The backend built for the web version should barely change — WebAuthn assertions are the same shape regardless of client — but everything native-side is new.',steps:['Get Joe’s Apple Developer Team ID — required for the apple-app-site-association file, not guessable','Host apple-app-site-association at centerpost.app/.well-known/, webcredentials entry for app.centerpost.app','Add the Associated Domains entitlement (webcredentials:centerpost.app) in Xcode Signing & Capabilities','Evaluate the open-source capacitor-passkey plugin against the exact JSON shape the server already expects — adopt it if it matches, otherwise build a small custom plugin mirroring the journal\'s existing _bioRequest native-bridge pattern','Change capacitor.config.json\'s server.hostname to centerpost.app — audit what currently depends on the old capacitor://localhost origin FIRST, this is the one step with real blast radius','Add a native branch to enrollTouchID/signInWithTouchID in legacy.js, remove the current capacitor-native hiding guard once it actually works','Verify on a real device at every stage — none of this is testable the way the web version was (no local Workers runtime equivalent for a Face ID prompt)'],model:'Mixed — Sonnet for the research spike and client wiring, Opus for the entitlement/origin change and the native plugin (security- and blast-radius-sensitive)',effort:'High — a new Xcode entitlement, a native Swift plugin, and an origin change needing a real audit; also touches the pending App Store submission surface (new capability, new entitlement) that the incorporation decision is already gating',status:'open',completedAt:null}
];
var PANEL_LIST_IDS={recommendations:'list-recommendations',decisions:'list-decisions',work:'list-work'};
function itemRowHTML(item){
var isDone=item.status==='completed';
var footer='';
if(item.model||item.effort){
footer='<div class="item-footer">'+(item.model?'<span class="item-chip">Model: '+item.model+'</span>':'')+(item.effort?'<span class="item-chip">Effort: '+item.effort+'</span>':'')+'</div>';
}
var stepsHtml='';
for(var i=0;i<item.steps.length;i++){stepsHtml+='<li>'+item.steps[i]+'</li>';}
var badge=isDone?'<span class="item-completed-badge">✓ Completed '+item.completedAt+'</span>':'';
return '<details class="item'+(isDone?' completed':'')+'" id="item-'+item.id+'">'+
'<summary class="item-summary">'+
'<span class="item-chevron" aria-hidden="true"></span>'+
'<span class="item-title-wrap">'+
'<span class="item-title">'+item.title+'</span>'+
'<span class="item-source">'+item.source+'</span>'+
badge+
'</span>'+
'</summary>'+
'<div class="item-body">'+
'<p class="detail-text">'+item.description+'</p>'+
'<p class="detail-section-label">Steps</p>'+
'<ul class="detail-list">'+stepsHtml+'</ul>'+
footer+
'</div>'+
'</details>';
}
function renderPanel(panelKey){
var container=document.getElementById(PANEL_LIST_IDS[panelKey]);
var items=panelData.filter(function(it){return it.panel===panelKey;});
if(items.length===0){
container.innerHTML='<p class="panel-empty">Nothing here yet.</p>';
return;
}
var open=items.filter(function(it){return it.status!=='completed';});
var done=items.filter(function(it){return it.status==='completed';});
done.sort(function(a,b){return (b.completedAt||'').localeCompare(a.completedAt||'');});
var html=open.map(itemRowHTML).join('');
if(done.length){
html+='<p class="completed-divider">Completed</p>'+done.map(itemRowHTML).join('');
}
container.innerHTML=html;
}
function renderAllPanels(){
renderPanel('recommendations');
renderPanel('decisions');
renderPanel('work');
}
(async function boot(){
await requireOwner();
renderAllPanels();
})();
</script>
</body>
</html>
