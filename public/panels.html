<style>
:root{
--text-primary:#1a1a1a;--text-secondary:#5f5e5a;--text-muted:#8a8880;--border:#e4e2da;
--surface-0:#faf9f6;--surface-1:#f1efe8;--surface-2:#ffffff;--radius:8px;
--err:#b3261e;--ok:#0F6E56;
}
@media (prefers-color-scheme: dark){
:root{
--text-primary:#f1efe8;--text-secondary:#c2c0b6;--text-muted:#8a8880;--border:#3a3937;
--surface-0:#1c1c1a;--surface-1:#26251f;--surface-2:#2c2b26;
--err:#f0997b;--ok:#5DCAA5;
}
}
*{box-sizing:border-box}
body{margin:0;background:var(--surface-0);color:var(--text-primary);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.page{max-width:760px;margin:0 auto;padding:2.5rem 1.5rem 4rem}
.nav-link{margin:0 0 10px}
.nav-link a{font-size:12px;color:var(--text-muted);text-decoration:none}
.nav-link a:hover{color:var(--text-secondary)}
.page-header{margin-bottom:1.75rem}
.page-header h1{font-size:22px;font-weight:500;margin:0 0 6px}
.page-header p{font-size:14px;color:var(--text-secondary);margin:0}
.lane{margin-bottom:22px}
.lane-label{font-size:12px;font-weight:500;color:var(--text-muted);margin:0 0 8px}
.panel-list{display:flex;flex-direction:column;gap:8px}
.panel-empty{font-size:13px;color:var(--text-muted);margin:0;padding:14px 12px;border:1px dashed var(--border);border-radius:var(--radius)}
.page-footer{margin-top:2.5rem;padding-top:1rem;border-top:1px solid var(--border);font-size:12px;color:var(--text-muted)}
.signin-overlay{position:fixed;inset:0;z-index:999;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,0.45);backdrop-filter:blur(3px)}
.signin-card{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:24px 22px;width:280px;box-shadow:0 8px 30px rgba(0,0,0,0.25)}
.signin-title{font-size:15px;font-weight:500;color:var(--text-primary);margin-bottom:2px}
.signin-sub{font-size:12px;color:var(--text-secondary);margin-bottom:16px}
.signin-card input{width:100%;box-sizing:border-box;margin-bottom:10px;padding:9px 10px;background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius);color:var(--text-primary);font-size:13px;font-family:inherit}
.signin-card button{width:100%;padding:9px 0;background:var(--text-primary);border:none;border-radius:var(--radius);color:var(--surface-0);font-weight:500;font-size:13px;cursor:pointer;font-family:inherit}
.signin-err{color:var(--err);font-size:11px;margin-top:8px;min-height:14px}
.item{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface-2);overflow:hidden}
.item-summary{list-style:none;cursor:pointer;padding:10px 12px;display:flex;align-items:flex-start;gap:8px}
.item-summary::-webkit-details-marker{display:none}
.item-chevron{display:inline-block;color:var(--text-muted);font-size:10px;flex-shrink:0;margin-top:3px;transition:transform .15s}
.item-chevron::before{content:'\25B8'}
.item[open] .item-chevron{transform:rotate(90deg)}
.item-title-wrap{display:flex;flex-direction:column;gap:2px;min-width:0}
.item-title{font-size:13px;font-weight:500;color:var(--text-primary)}
.item-source{font-size:11px;color:var(--text-muted)}
.item-body{padding:0 14px 14px 34px}
.detail-section-label{font-size:12px;font-weight:500;color:var(--text-muted);margin:10px 0 4px}
.detail-text{font-size:13px;line-height:1.6;color:var(--text-primary);margin:0}
.detail-list{margin:4px 0 0;padding-left:18px;font-size:13px;line-height:1.6;color:var(--text-secondary)}
.item-footer{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.item-chip{font-size:11px;color:var(--text-muted);background:var(--surface-1);border:1px solid var(--border);border-radius:6px;padding:3px 8px}
.item.completed{opacity:.55}
.item-completed-badge{display:block;font-size:11px;color:var(--ok);margin-top:2px}
.completed-divider{font-size:11px;font-weight:500;color:var(--text-muted);margin:14px 0 8px;text-transform:uppercase;letter-spacing:.03em}
</style>

<script>
var OWNER_EMAIL='medicjth@gmail.com';
if(typeof firebase!=='undefined'&&typeof CENTERPOST_FIREBASE_CONFIG!=='undefined'){
firebase.initializeApp(CENTERPOST_FIREBASE_CONFIG);
}
function showSignIn(msg){
var ov=document.getElementById('panels-signin');
if(!ov){
ov=document.createElement('div');
ov.id='panels-signin';
ov.className='signin-overlay';
ov.innerHTML=
'<form id="panels-signin-form" class="signin-card">'+
'<div class="signin-title">Centerpost panels</div>'+
'<div class="signin-sub">Owner sign-in required</div>'+
'<input id="psi-email" type="email" placeholder="Email" autocomplete="username" required>'+
'<input id="psi-pass" type="password" placeholder="Password" autocomplete="current-password" required>'+
'<button type="submit">Sign in</button>'+
'<div id="psi-err" class="signin-err"></div>'+
'</form>';
document.body.appendChild(ov);
document.getElementById('panels-signin-form').addEventListener('submit',async function(e){
e.preventDefault();
var err=document.getElementById('psi-err');
err.textContent='';
try{
await firebase.auth().signInWithEmailAndPassword(
document.getElementById('psi-email').value.trim(),
document.getElementById('psi-pass').value
);
}catch(ex){
err.textContent=ex.message||'Sign-in failed';
}
});
}
if(msg)document.getElementById('psi-err').textContent=msg;
ov.style.display='flex';
}
function hideSignIn(){
var ov=document.getElementById('panels-signin');
if(ov)ov.style.display='none';
}
function requireOwner(){
return new Promise(function(resolve){
firebase.auth().onAuthStateChanged(function(user){
if(user&&!user.isAnonymous&&user.email&&user.email.toLowerCase()===OWNER_EMAIL){
hideSignIn();
resolve(user);
}else if(user&&!user.isAnonymous){
firebase.auth().signOut().catch(function(){});
showSignIn('Not authorized for this account.');
}else{
if(user&&user.isAnonymous)firebase.auth().signOut().catch(function(){});
showSignIn();
}
});
});
}
var panelData=[
{id:'kids-mode-separation',panel:'work',title:'Kids Mode separated from the product entirely — and G-06 closed',source:'Joe’s call, 2026-08-11 — to remove a step from App Store approval (kids apps + children’s data storage). Supersedes R13.5, which only went half way. Web 7d6765d, sync script e59b17c; CONFIRMED ON DEVICE build 86, 2026-08-11.',description:'Kids Mode is no longer part of either app. The headline finding: R13.5 had hidden every native entry point, but kids.html (189 KB) and its 5 assets were still physically shipping INSIDE the iOS bundle — and a reviewer reads the bundle, not the UI. Hiding buttons was never going to clear the Kids Category question; removing the files does. kids.html still exists and still works as a standalone page at centerpost.app/kids.html, unlinked, on the teacher.html model.',steps:['Native bundle: centerpost-sync.sh now deletes all 6 kids files from WWW/ on every sync (rsync --delete restores them each run, so it has to re-run), with a hard stop if the deletion ever fails rather than silently shipping it','Web app entry points removed: the Settings “Kids Mode” section, openKidsMode(), and 4 landing-page references (hero CTA, feature card, footer link, nav link)','Service worker: kids.html, its manifest, its 4 icons and the kids-only Press Start 2P/VT323 fonts dropped from the precache — the app has no business caching a page it no longer links to','How To: section 15 removed and sections 16–17 renumbered; verified all 16 sections and TOC links still resolve with no gap','Docs updated: privacy policy COPPA section, data-inventory §1.5, app-store-compliance Kids Category row, COMPLIANCE-GAPS G-06','CONFIRMED ON DEVICE build 86: no Kids section in Settings, no Kids links on the sign-in/landing screen, nothing broken where it used to be — and kids.html still loads and still syncs standalone in Safari at centerpost.app/kids','FOLLOW-UP SAME DAY — G-06 now fully CLOSED (web 98caa02): the account sync was removed too. The ~316-line Firebase block, the 3 SDK script tags and config.js are gone from kids.html; it writes nothing to users/{uid}/data/kids and makes no data request at all. Also purges personal data rather than just ceasing to write it — state.sync held the PARENT’S EMAIL in localStorage, and it plus _kidsParentUid/_kidsParentEmail are now deleted on load and stripped from restored backups. Cross-device is the manual backup file that already existed','Legacy users/{uid}/data/kids docs left alone on purpose: nothing writes to them, ‘kids’ stays in USER_DATA_DOCS so they’re still erased on account deletion, and the privacy policy carries a historical note','CLOSED — one bookkeeping item rides the next native build, nothing functional. kids.html isn’t in the iOS bundle at all, so the G-06 change needs no ship; and Settings → About & Legal opens the LIVE centerpost.app/privacy, so native users already see the updated COPPA wording. The only stale artifact is the unused bundled copy of privacy.html sitting in build 86, which the next sync refreshes. Worth noting rather than ignoring: a stale legal doc inside the binary is exactly the “inspect the bundle, not the UI” class of thing that hid the kids.html problem in the first place'],model:'Sonnet 5',effort:'Done — one unused bundled file refreshes on the next native sync',status:'completed',completedAt:'2026-08-11'},
{id:'zindex-confirm-and-toast',panel:'work',title:'Two stacking-order bugs found testing build 84/85 — confirm dialog and toasts',source:'Found by Joe on-device while testing the G-05 fix, 2026-08-11. Web f2a61cf + dfca9dc; confirm fix CONFIRMED ON DEVICE build 85, toast fix CONFIRMED ON DEVICE build 86.',description:'Both are the same failure: a layer that gets raised FROM other surfaces was sitting BELOW them, so it opened invisibly. Neither loses data, but the second one can make a failure look like nothing happened.',steps:['Confirm dialog: _confirm() is z-1100 but is raised from Settings (z-1400) and the gcal modal (z-2000). Settings → Delete my account opened its own confirmation behind the Settings sheet — open and taking taps, just invisible. Now z-2500. The comment justifying Settings at 1400 claimed “account delete uses native confirm”; it never did','Toasts: .toast was z-999 — below EVERY overlay in the app. Settings hid its own “Export downloaded”, “Export failed” and “Account deleted” toasts. .toast.update-toast had already been bumped to 10002 for this exact reason, but only that one instance was ever fixed. Base .toast now 9500','Both verified at the CSSOM level rather than by eye — matching rules walked to confirm which one wins and that no ancestor creates a stacking context, per the safe-area-inset lesson (a “verified” CSS fix that was actually a dead rule losing a specificity tie)','Joe confirmed the confirm-dialog fix on device in build 85, plus a regression pass on journal/task/reminder confirms','Toast fix confirmed on device in build 86: Settings → Export my data now shows its “Preparing your export…” and “✓ Export downloaded” toasts, which were invisible in 85'],model:'Sonnet 5',effort:'Done',status:'completed',completedAt:'2026-08-11'},
{id:'r8-journal-faceid-native',panel:'work',title:'Journal Face ID unlock (native) — confirmed on device',source:'R8 phase 2, shipped 2026-07-31 (web a2a8657, native 447d32f, build 60); backfilled here 2026-08-09 — this page didn’t exist yet when it originally shipped',description:'Face ID/Touch ID unlocks the encrypted journal on native — the AES key is held in the device Keychain behind biometrics after a PIN unlock, so day-to-day opening is one glance instead of retyping the PIN. Not the same thing as native account sign-in (that’s a separate, still-open item below) — this only unlocks an already-signed-in device’s journal. JS side proven via a stubbed-native-Keychain technique; real Face ID confirmed on device by Joe at the time, and reconfirmed 2026-08-09.',steps:['Proven end-to-end: PIN unlock stores the key in Keychain (kSecAttrAccessibleWhenUnlockedThisDeviceOnly, .biometryCurrentSet)','Next journal open prompts Face ID instead of the PIN','A changed enrolled biometric invalidates the stored key — falls back to PIN, no server escrow'],model:'Sonnet 5',effort:'Done',status:'completed',completedAt:'2026-08-09'},
{id:'r10-complication',panel:'work',title:'R10 — watch face Timer complication: confirm on-device',source:'Senior design review 2026-07-28 · R10, built 2026-07-31',description:'The WidgetKit complication for the Focus Timer is built and compiles clean (BUILD SUCCEEDED, correctly embedded in both bundle locations), but has never actually run on a real watch face.',steps:['Run centerpost-sync, then Xcode Archive, then TestFlight','Open Signing & Capabilities for the new CenterpostWatchComplication target (and re-check the watch app’s) — new App Groups don’t always self-provision','Add the complication to a real watch face from the Watch app, or by long-pressing the face','Start a Focus Timer and confirm the complication counts down live','Let it finish or reset it, confirm it reverts to Idle'],model:'Sonnet 5',effort:'Low — verification only, code already exists',status:'completed',completedAt:'2026-08-04'},
{id:'r7-archive-sweep',panel:'work',title:'R7 Ship-3 — confirm reminder archive auto-sweep on a real device',source:'Senior design review 2026-07-28 · R7 Ship-3, shipped native build 57',description:'Reminders older than 7 days should auto-archive on the daily rollover tick. Verified against boundary-exact test data and the sync-merge suite, and now confirmed on a real device — a reminder past the 7-day mark landed in the collapsed Archived folder after rollover, not the live list.',steps:['Find or create a reminder with a due date more than 7 days in the past','Let the app sit through a day rollover, or fake the device date forward a day','Confirm it lands in the collapsed "Archived" folder, not still in the live list'],model:'Sonnet 5',effort:'Low — on-device check only, no new code',status:'completed',completedAt:'2026-08-09'},
{id:'988-threshold',panel:'decisions',title:'Is the 988 crisis-line trigger (3 resets/hour) right for shift workers? — Decided: raised to 5',source:'Persona panel 3, 2026-08-02 — surfaced 2026-08-02, decided 2026-08-09',description:'The breathwork-frequency safety net showed one dismissible 988 line after 3 resets in a rolling hour. The ER-nurse persona flagged that 3 resets/hr can be normal for someone mid-shift — Joe’s call was to loosen the threshold rather than make it context-aware. Raised to 5 (BREATH_RESOURCE_THRESHOLD in legacy.js), shipped web.',steps:['Decided: raised the threshold from 3 to 5, not made context-aware','Verified in-browser: the note stays hidden through the 4th session start and appears from the 5th onward, before shipping'],status:'completed',completedAt:'2026-08-09'},
{id:'r13-copy-pass',panel:'work',title:'Copywriting pass on R13’s first-draft subtitle/hint text — shipped',source:'Senior design review 2026-07-28 · R13, shipped 2026-07-30. Copy tightened and shipped 2026-08-11.',description:'R13 added plain-language subtitles to HALT+/Urge Log and empty-state hints. The report flagged the wording as a first draft, not final copy. Tightened the HALT+ and Urge Log subtitles to cut jargon ("one-tap diagnostic", "tank executive function") and wordiness; Tasks/Notes empty-state hints were already tight and left as-is.',steps:['Pulled the current strings — HALT+/Urge Log subtitles, Tasks/Notes empty-state text','Tightened the wording together, confirmed with Joe before editing','Verified the new copy in-browser by rendering both modals directly (pre-login DOM check)','Shipped web-only (ad53ef2), confirmed live: SW stamp matches, config.js 200, site loads'],model:'Sonnet 5',effort:'Done',status:'completed',completedAt:'2026-08-11'},
{id:'app-store-submission-prep',panel:'recommendations',title:'Prep and submit the App Store Connect listing',source:'Based on your App Store direction decision — Persona panel 3, 2026-08-02. Updated 2026-08-09 after the legal doc suite (below) resolved most of the groundwork.',description:'Persona panel 3’s direction answer made the App Store the front door for launch. The compliance groundwork this needed is now done — the encryption-compliance key, the nutrition-label answers, and the Sign in with Apple question are all resolved. What’s left is the actual App Store Connect submission, which only you can do.',steps:['DONE — ITSAppUsesNonExemptEncryption=false confirmed present, and the sync script self-heals it if it’s ever missing','DONE — nutrition-label answers drafted from a real code audit in docs/legal/app-store-compliance.md §1 (Health & Fitness must be declared; Usage Data and Diagnostics are NOT linked to the user; no Tracking anywhere)','DONE — Sign in with Apple concern resolved as a non-issue: this app has no third-party login at all (see the "988-threshold"-style close-out on G-11 in COMPLIANCE-GAPS.md) — nothing to add before submitting','DONE — Privacy Policy URL exists and is live: centerpost.app/privacy (plus 4 companion docs)','Draft the listing: description, keywords, promotional text, screenshots per required device size','Enter the App Privacy answers from app-store-compliance.md §1 into App Store Connect’s nutrition-label UI','Enter centerpost.app/privacy as the Privacy Policy URL','Set the age rating honestly — flag the crisis-resource (988) and breathwork content in the questionnaire rather than answering as if this were a plain productivity app','Submit for review'],model:'Sonnet 5',effort:'Low-Medium now — the compliance research is done; what’s left is mostly you, in App Store Connect',status:'open',completedAt:null},
{id:'privacy-policy-page',panel:'work',title:'Legal & disclosure document suite — audited, published, and shipped to native',source:'Full session 2026-08-06 through 2026-08-09. Supersedes the original "Publish a privacy policy page" recommendation (Persona panel 3, 2026-08-02) — grew from one page into a full suite once the underlying data was actually audited.',description:'Code-first audit of every data flow in the app (Firestore, Worker KV, Sentry, SendGrid, HealthKit, Google Calendar) before writing a word of policy — found the product’s privacy story was already clean, but found 4 real gaps: prompt text was being logged for abuse detection, Firestore backup retention was unverified, an old audit had wrongly flagged Google Sign-In as a login method, and Google Calendar sync was never disclosed anywhere. All four fixed. Five public documents (privacy, consumer health data, terms, AI disclosure, medical/crisis disclaimer) are live at real routes, and Settings now has in-app links to them on native — confirmed working on a real device in TestFlight build 81.',steps:['Data audit + gap analysis — docs/legal/data-inventory.md, COMPLIANCE-GAPS.md','5 public documents drafted, matching Utah AI-disclosure and Washington MHMDA standards, not just generic boilerplate','Prompt-text logging fixed and deployed (Jarvis + Guardian workers) — only the matched pattern name is ever stored, never what you typed','Firestore backup retention confirmed at 98 days (the longer of PITR’s 7 days and the daily-backup schedule) and written into the policy honestly','Google Calendar sync — a real, undisclosed data flow found mid-review — now has its own privacy-policy section explaining the access plainly','Docs published live: centerpost.app/privacy, /health-privacy, /terms, /ai, /disclaimer, with the MHMDA-required separate homepage link to the health-data policy','Settings → About & Legal added on native, opening docs in an in-app Safari sheet (reused the app’s existing native bridge — no new Capacitor dependency)','Native build 81 shipped to TestFlight and confirmed on-device'],model:'Sonnet 5',effort:'Done',status:'completed',completedAt:'2026-08-09'},
{id:'legal-docs-attorney-review',panel:'recommendations',title:'Get the legal doc suite attorney-reviewed before relying on it publicly',source:'Legal & disclosure doc suite, 2026-08-06 through 2026-08-09',description:'Every document says plainly it was AI-drafted and not yet attorney-reviewed. That’s true and the docs are usable as-is for now, but five things in there are the kind an actual lawyer should sign off on before you’d want to lean on them in a dispute.',steps:['The arbitration clause + class-action waiver (Terms of Service §11) — enforceability and consumer-fairness rules vary by state and are actively litigated','Whether the "general wellness, not treatment" positioning holds up under FDA guidance given the DBT/CBT-derived tools plus urge logging plus mood inference','Washington MHMDA exposure specifically — it has a private right of action, the highest-dollar risk in the set','The Kids Mode COPPA framing (parent-operated account model) — the architecture is right, but a real opinion would be worth having','The liability cap (Terms §9) — standard language, but Indiana-specific enforceability for a wellness product is worth confirming'],model:null,effort:'Joe + outside counsel — not something I can do',status:'open',completedAt:null},
{id:'compliance-gaps-small-fixes',panel:'work',title:'Compliance gaps G-03, G-04, G-10 — closed',source:'COMPLIANCE-GAPS.md G-03 / G-04 / G-10, closed 2026-08-11',description:'Three small, independent, code-level items from the compliance audit. G-10 turned up a real finding along the way: the weather.gov/Overpass third-party calls it asked to document had actually been dead code since an earlier cleanup (commit 9b158e9) — that old code sent precise geolocation, not just IP, to both. Corrected the disclosure instead of documenting a flow that no longer exists.',steps:['G-03: navigator.globalPrivacyControl read on load, surfaced in Settings → About & Legal as an acknowledgement banner; privacy policy states GPC is recognized (web 6eaf8e4)','G-04: explicit tracking_settings (click/open/subscription/ganalytics all off) added to all 3 SendGrid mail/send payloads in centerpost-workers (guardian, sentinel, pulse); deployed via wrangler to all three Workers','G-10: found the weather.gov/Overpass code path was already removed (9b158e9) — grep-verified zero references left anywhere; removed the two stale CSP connect-src entries and corrected privacy-policy.md, privacy.html, and data-inventory.md instead of the originally-scoped \"confirm and document\" fix','Verified live: SW stamp matches, config.js 200, /privacy confirmed clean of weather.gov/Overpass + shows the new GPC paragraph, CSP header confirmed to no longer allow either domain'],model:'Sonnet 5',effort:'Done',status:'completed',completedAt:'2026-08-11'},
{id:'cross-device-deletion-cleanup',panel:'work',title:'G-05 — deleted-account data now purges itself on your other devices',source:'COMPLIANCE-GAPS.md G-05 — same bug shape as the cross-account localStorage leaks (a3f6c42, 2b1e21d). Closed 2026-08-11 (web 93c1896, jarvis worker bc15f5e).',description:'Deleting an account wiped the server and the device you deleted from, but a second signed-in device kept its localStorage mirror (check-ins, mood log, encrypted journal) indefinitely. Took the full code fix rather than the documented-caveat option, given this bug class had already bitten the app twice. Found and fixed a second gap along the way: the same-device wipe had silently drifted out of date and was never clearing check-ins, mood log, or the Axis profile — so those survived deletion even on the device you deleted from.',steps:['New POST /account/exists endpoint on the jarvis Worker — necessarily unauthenticated (the caller’s account is gone, so it has no token), origin-gated and IP rate-limited on the same bucket as Touch ID login','Client purge runs in the signed-out branch of onAuthStateChanged — exactly where a second device lands, because deleting an account revokes its refresh token','Fails closed in every direction: a 503, a thrown fetch, a malformed body, or an ordinary sign-out all purge nothing. Only an explicit {exists:false} deletes anything — a false “gone” would destroy a live user’s data','Same-device fix: cpCheckins_/cpMoodLog_/cpAxisProfile_ added to the wipe; both wipe paths now share one UID_SCOPED_LS_PREFIXES list so they can’t drift apart again','Verified: 5 client cases in-browser (happy path + 4 failure modes), then end-to-end against the deployed Worker — a live uid kept its data, a nonexistent uid was purged, the signed-out “local” scope untouched. Endpoint verified live (real uid→true, fake uid→false, 400 on missing uid, 403 on bad origin, /health unbroken)','Privacy policy §9 “other devices” caveat rewritten to match the new behavior'],model:'Sonnet 5',effort:'Done',status:'completed',completedAt:'2026-08-11'},
{id:'kids-take-meds-wording',panel:'work',title:'"Take meds" default chore item in Kids Mode — removed',source:'COMPLIANCE-GAPS.md G-06, closed 2026-08-16 (web 9d3b524)',description:'kids.html shipped a default "Take meds" 💊 checklist item for children — the one thing that pulled the parent-run chore tracker into health-data territory. The account architecture was already fine (parent-only account, child never logs in, no data ever reaches Centerpost per the 2026-08-11 G-06 closure) and the privacy policy already has a Family Features section — but it was still the one detail that could prompt a reviewer to ask. Removed outright rather than renamed or made opt-in.',steps:['Removed the m3 ("Take meds") entry from DEFAULT_ROUTINES.morning and the e4 entry from DEFAULT_ROUTINES.evening in kids.html','Grep-verified no other references to the removed item ids or the string "Take meds" remain in the file','Shipped web-only (9d3b524), verified live: SW stamp matches, config.js 200, page renders'],model:'Sonnet 5',effort:'Done',status:'completed',completedAt:'2026-08-16'},
{id:'native-touch-face-id',panel:'work',title:'Face ID/Touch ID sign-in on native (iPhone, iPad, and the Mac-hosted app) — shipped',source:'Follow-up to Touch ID sign-in (web/Mac browser), shipped 2026-08-05. Built and shipped 2026-08-18 — sign-in in build 90, enrollment in build 91. BOTH CONFIRMED ON DEVICE.',description:'Touch ID sign-in works in a Mac browser at centerpost.app — Settings → Touch ID sign-in. Native was a real gap, not a smaller version of the same fix: a WKWebView’s navigator.credentials calls never reach the system passkey UI, so the ceremony had to move into an actual native Swift call (AuthenticationServices). Two things planned for this turned out to be unnecessary, and both were the expensive parts. The capacitor.config.json origin change — written up here as "the one step with real blast radius" — is not needed at all: Apple matches the app’s bundle ID + Team ID against the apple-app-site-association file, and the WebView’s origin never enters that check, so capacitor://localhost stays exactly as it was and so does the Worker’s CORS allowlist. The backend needed zero changes rather than "barely any": RP_ID and ORIGIN were already centerpost.app, and the JSON the native path posts to /webauthn/login-verify was checked byte-for-byte against what the browser path produces and is identical. The credential is the same passkey either way — it lives in the iCloud Keychain — so one enrolled in Safari on the Mac should sign you in on the phone with nothing new to enrol.',steps:['DONE — Team ID: already in project.pbxproj as DEVELOPMENT_TEAM (CN383S6YZK), identical across all 14 targets. Never needed asking for; it is not a secret, and the AASA file publishes it deliberately','DONE — apple-app-site-association hosted at centerpost.app/.well-known/ with a webcredentials entry for app.centerpost.app. Needed a _headers rule forcing content-type application/json (the file is deliberately extensionless, so Pages would otherwise serve it as octet-stream and Apple’s validator rejects it). Verified live: 200 application/json','DONE — Associated Domains entitlement (webcredentials:centerpost.app) added to App.entitlements. All 14 targets use automatic signing, so Xcode registers the capability on the App ID itself — no developer-portal step','DONE — built a custom PasskeyBridge.swift rather than adopting capacitor-passkey: it avoids a third-party dependency on the auth path, needs no Capacitor plugin install, and mirrors the journal’s existing _bioRequest bridge over the same `notify` channel. Covers both assert (sign-in) and register (enrollment); register is shipped but not yet called, so enrolling from the phone later is a JS-only change','DROPPED — the capacitor.config.json server.hostname change. Not required, see the description. This removed the entire blast-radius audit that made this item expensive','DONE — native branch in signInWithTouchID, plus a fix to the sign-in button reveal: it gated on a localStorage enrolment hint that is a browser heuristic and is always empty on a fresh app install, even when a usable passkey is already in the Keychain. Button also relabels to "Face ID", which the markup hardcodes as "Touch ID"','DONE — CONFIRMED ON DEVICE, build 90. Off-device verification had got as far as it can: swiftc -typecheck clean against the iOS 15 SDK, and a stubbed-native-bridge browser test proving the request/reply shapes, the button relabel, the quiet-cancel path, and that web sign-in is untouched. The archived, signed app was also checked directly and does carry the webcredentials entitlement','DONE + CONFIRMED ON DEVICE (web d08aeb7, native build 91) — enrolling a NEW passkey directly on the phone. Both native hide-guards dropped (the loadTouchIDDevices early return and the waSettingsSection display:none), and the Settings copy, which the markup hardcodes for a Mac, is relabelled from the device plus the bridge’s reported biometry type: the phone reads Face ID and the Mac reads Touch ID. The device list works on native too — each enrolled device with its last use and a Remove button. Needed a SECOND build despite the Swift register op already shipping in 90, because the native app serves its bundled WWW/ and a web deploy never reaches it. Worth remembering: register-options returns its options at the TOP level where login-options nests them under .options, and handing the wrong one to the bridge fails as bad-challenge'],model:'Mixed — Sonnet for the research spike and client wiring, Opus for the entitlement and the native plugin (security-sensitive). In practice the blast-radius work priced into this never materialised',effort:'Was estimated High on the assumption of an origin change needing a real audit. Actual: Medium — the origin change was dropped and the backend was untouched, leaving a new entitlement, one self-contained Swift file, and a small JS branch. Still touches the App Store submission surface (new capability, new entitlement) that the incorporation decision gates',status:'completed',completedAt:'2026-08-18'}
];
var PANEL_LIST_IDS={recommendations:'list-recommendations',decisions:'list-decisions',work:'list-work'};
function itemRowHTML(item){
var isDone=item.status==='completed';
var footer='';
if(item.model||item.effort){
footer='<div class="item-footer">'+(item.model?'<span class="item-chip">Model: '+item.model+'</span>':'')+(item.effort?'<span class="item-chip">Effort: '+item.effort+'</span>':'')+'</div>';
}
var stepsHtml='';
for(var i=0;i<item.steps.length;i++){stepsHtml+='<li>'+item.steps[i]+'</li>';}
var badge=isDone?'<span class="item-completed-badge">✓ Completed '+item.completedAt+'</span>':'';
return '<details class="item'+(isDone?' completed':'')+'" id="item-'+item.id+'">'+
'<summary class="item-summary">'+
'<span class="item-chevron" aria-hidden="true"></span>'+
'<span class="item-title-wrap">'+
'<span class="item-title">'+item.title+'</span>'+
'<span class="item-source">'+item.source+'</span>'+
badge+
'</span>'+
'</summary>'+
'<div class="item-body">'+
'<p class="detail-text">'+item.description+'</p>'+
'<p class="detail-section-label">Steps</p>'+
'<ul class="detail-list">'+stepsHtml+'</ul>'+
footer+
'</div>'+
'</details>';
}
function renderPanel(panelKey){
var container=document.getElementById(PANEL_LIST_IDS[panelKey]);
var items=panelData.filter(function(it){return it.panel===panelKey;});
if(items.length===0){
container.innerHTML='<p class="panel-empty">Nothing here yet.</p>';
return;
}
var open=items.filter(function(it){return it.status!=='completed';});
var done=items.filter(function(it){return it.status==='completed';});
done.sort(function(a,b){return (b.completedAt||'').localeCompare(a.completedAt||'');});
var html=open.map(itemRowHTML).join('');
if(done.length){
html+='<p class="completed-divider">Completed</p>'+done.map(itemRowHTML).join('');
}
container.innerHTML=html;
}
function renderAllPanels(){
renderPanel('recommendations');
renderPanel('decisions');
renderPanel('work');
}
(async function boot(){
await requireOwner();
renderAllPanels();
})();
</script>
