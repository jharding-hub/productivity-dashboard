<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Centerpost panels</title>
<script src="config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<style>
:root{
--text-primary:#1a1a1a;--text-secondary:#5f5e5a;--text-muted:#8a8880;--border:#e4e2da;
--surface-0:#faf9f6;--surface-1:#f1efe8;--surface-2:#ffffff;--radius:8px;
--err:#b3261e;--ok:#0F6E56;
}
@media (prefers-color-scheme: dark){
:root{
--text-primary:#f1efe8;--text-secondary:#c2c0b6;--text-muted:#8a8880;--border:#3a3937;
--surface-0:#1c1c1a;--surface-1:#26251f;--surface-2:#2c2b26;
--err:#f0997b;--ok:#5DCAA5;
}
}
*{box-sizing:border-box}
body{margin:0;background:var(--surface-0);color:var(--text-primary);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.page{max-width:760px;margin:0 auto;padding:2.5rem 1.5rem 4rem}
.nav-link{margin:0 0 10px}
.nav-link a{font-size:12px;color:var(--text-muted);text-decoration:none}
.nav-link a:hover{color:var(--text-secondary)}
.page-header{margin-bottom:1.75rem}
.page-header h1{font-size:22px;font-weight:500;margin:0 0 6px}
.page-header p{font-size:14px;color:var(--text-secondary);margin:0}
.lane{margin-bottom:22px}
.lane-label{font-size:12px;font-weight:500;color:var(--text-muted);margin:0 0 8px}
.panel-list{display:flex;flex-direction:column;gap:8px}
.panel-empty{font-size:13px;color:var(--text-muted);margin:0;padding:14px 12px;border:1px dashed var(--border);border-radius:var(--radius)}
.page-footer{margin-top:2.5rem;padding-top:1rem;border-top:1px solid var(--border);font-size:12px;color:var(--text-muted)}
.signin-overlay{position:fixed;inset:0;z-index:999;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,0.45);backdrop-filter:blur(3px)}
.signin-card{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:24px 22px;width:280px;box-shadow:0 8px 30px rgba(0,0,0,0.25)}
.signin-title{font-size:15px;font-weight:500;color:var(--text-primary);margin-bottom:2px}
.signin-sub{font-size:12px;color:var(--text-secondary);margin-bottom:16px}
.signin-card input{width:100%;box-sizing:border-box;margin-bottom:10px;padding:9px 10px;background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius);color:var(--text-primary);font-size:13px;font-family:inherit}
.signin-card button{width:100%;padding:9px 0;background:var(--text-primary);border:none;border-radius:var(--radius);color:var(--surface-0);font-weight:500;font-size:13px;cursor:pointer;font-family:inherit}
.signin-err{color:var(--err);font-size:11px;margin-top:8px;min-height:14px}
.item{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface-2);overflow:hidden}
.item-summary{list-style:none;cursor:pointer;padding:10px 12px;display:flex;align-items:flex-start;gap:8px}
.item-summary::-webkit-details-marker{display:none}
.item-chevron{display:inline-block;color:var(--text-muted);font-size:10px;flex-shrink:0;margin-top:3px;transition:transform .15s}
.item-chevron::before{content:'\25B8'}
.item[open] .item-chevron{transform:rotate(90deg)}
.item-title-wrap{display:flex;flex-direction:column;gap:2px;min-width:0}
.item-title{font-size:13px;font-weight:500;color:var(--text-primary)}
.item-source{font-size:11px;color:var(--text-muted)}
.item-body{padding:0 14px 14px 34px}
.detail-section-label{font-size:12px;font-weight:500;color:var(--text-muted);margin:10px 0 4px}
.detail-text{font-size:13px;line-height:1.6;color:var(--text-primary);margin:0}
.detail-list{margin:4px 0 0;padding-left:18px;font-size:13px;line-height:1.6;color:var(--text-secondary)}
.item-footer{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.item-chip{font-size:11px;color:var(--text-muted);background:var(--surface-1);border:1px solid var(--border);border-radius:6px;padding:3px 8px}
.item.completed{opacity:.55}
.item-completed-badge{display:block;font-size:11px;color:var(--ok);margin-top:2px}
.completed-divider{font-size:11px;font-weight:500;color:var(--text-muted);margin:14px 0 8px;text-transform:uppercase;letter-spacing:.03em}
</style>
</head>
<body>
<div class="page">
<p class="nav-link"><a href="architecture.html">&larr; Architecture</a></p>
<div class="page-header">
<h1>Centerpost panels</h1>
<p>Recommendations, decisions, and work from design reviews. Owner-only.</p>
</div>
<div class="lane">
<p class="lane-label">Recommendations</p>

</div>
<div class="lane">

<div class="panel-list" id="list-decisions"><p class="panel-empty">Nothing here yet.</p></div>
</div>

</div>
<script>
var OWNER_EMAIL='medicjth@gmail.com';
if(typeof firebase!=='undefined'&&typeof CENTERPOST_FIREBASE_CONFIG!=='undefined'){
firebase.initializeApp(CENTERPOST_FIREBASE_CONFIG);
}
function showSignIn(msg){
var ov=document.getElementById('panels-signin');
if(!ov){
ov=document.createElement('div');
ov.id='panels-signin';
ov.className='signin-overlay';
ov.innerHTML=
'<form id="panels-signin-form" class="signin-card">'+
'<div class="signin-title">Centerpost panels</div>'+
'<div class="signin-sub">Owner sign-in required</div>'+
'<input id="psi-email" type="email" placeholder="Email" autocomplete="username" required>'+
'<input id="psi-pass" type="password" placeholder="Password" autocomplete="current-password" required>'+
'<button type="submit">Sign in</button>'+
'<div id="psi-err" class="signin-err"></div>'+
'</form>';
document.body.appendChild(ov);
document.getElementById('panels-signin-form').addEventListener('submit',async function(e){
e.preventDefault();
var err=document.getElementById('psi-err');
err.textContent='';
try{
await firebase.auth().signInWithEmailAndPassword(
document.getElementById('psi-email').value.trim(),
document.getElementById('psi-pass').value
);
}catch(ex){
err.textContent=ex.message||'Sign-in failed';
}
});
}
if(msg)document.getElementById('psi-err').textContent=msg;
ov.style.display='flex';
}
function hideSignIn(){
var ov=document.getElementById('panels-signin');
if(ov)ov.style.display='none';
}
function requireOwner(){
return new Promise(function(resolve){
firebase.auth().onAuthStateChanged(function(user){
if(user&&!user.isAnonymous&&user.email&&user.email.toLowerCase()===OWNER_EMAIL){
hideSignIn();
resolve(user);
}else if(user&&!user.isAnonymous){
firebase.auth().signOut().catch(function(){});
showSignIn('Not authorized for this account.');
}else{
if(user&&user.isAnonymous)firebase.auth().signOut().catch(function(){});
showSignIn();
}
});
});
}
var panelData=[
{id:"ps-stage-1-copy-and-docs",panel:"recommendations",title:"Stage 1 of 9 — Copy, labels and doc sync (no logic changes)",source:"Panel Survey: Suggestions for a Broader User Base, 2026-08-18 — outputs/Centerpost-Panel-Survey-Broader-Base-2026-08-18.docx. Eight personas (5 returning, 3 new), web + iOS build 92 + watchOS all exercised. Stage 1 of 9 — do this first: it is the highest reach-per-effort work in the survey and touches no logic.",description:"Everything in this stage is a string or a markdown file. Nothing branches, nothing renders differently, no data moves — so it batches into one commit and one deploy with essentially no regression surface. It is grouped first because three separate personas independently misread the same labels, and because the legal-doc drift is the one finding that gets worse the closer you get to App Store review. Covers survey items I-4, I-11, J-3, I-12 and the copy half of A-1. NOTE: the native app serves its own bundled WWW/, so none of this reaches iOS until a centerpost-sync + build — but nothing here is urgent enough to ship native on its own; let it ride the next native build.",steps:["I-4 — the plain-language pass. Label the days-shown-up medal (three personas read the bare medal+number as a streak or a notification count, which misreads the single best mechanic in the app); subtitle the Tool Kit and Home tiles that still have none (Breathwork, Energy &amp; Mood, Wellness, Brain Dump, Routines, Stuck? Help) in the same voice as the shipped HALT+/Urge Log subtitles; add a one-tap “what is this?” to Presence where it appears in Weekly Review and Insights; give the idle FOCUS box a verb (it currently shows the wall-clock time and reads as a clock, so the Basic User never discovered the timer existed); and replace desktop-only hint text on touch devices (Quick Capture says “Esc discards” on a phone with no Esc key).","I-11 — breathwork honesty. Replace the blanket “Each is evidence-based” line with per-technique framing, and add one caution line to the techniques with breath-holds. Both the Clinician and the Skeptic raised this independently; the Skeptic’s exact words about the caution line were “that sentence would fully satisfy me”. The Balban 2023 citation on the Physiological Sigh is correct and is the model to hold the others to — note that the trial studied five minutes daily for a month, not a single 60-second session.","J-3 — remove the “Free”/“Pro” badges from the theme picker while BETA_ALL_THEMES has everything unlocked. Right now two lonely “Free” badges are the only price signal anywhere in the product, which reads as a surprise bill coming. This is consistent with panel 3’s dormant-paywall trust-debt finding.","I-12 — sync the legal docs to the shipped product. The Skeptic found real drift: health-privacy still describes classic HALT fields (hunger/anger/loneliness/tiredness) that the shipped HALT+ does not have, still references the removed children’s chore tracker, and lists “streaks” as ordinary content when the app pointedly has none — all under a banner saying the docs are AI-drafted and not attorney-reviewed. Edit docs/legal/*.md, re-run scripts/render-legal-docs.js, redeploy. The attorney review itself is already tracked separately below.","A-1 (copy half) — the front door says “Get Started — Free” and then demands an invite code. Both new personas bounced there inside two minutes; the Clinician cannot refer anyone into it. The waitlist and any real opening of signup is Stage 4 — this step is only the honesty fix, so the CTA stops promising something the next screen refuses.","PROMPT FOR CLAUDE CODE — paste this: “Read ~/dev/productivity-dashboard/CLAUDE.md first. This is a copy-only pass from the 2026-08-18 panel survey — no logic, no new state, no behaviour changes. In public/legacy.js and the React shell under src/components: (1) label the days-shown-up medal so the number reads as days, not a streak or a badge count, and add a short first-tap explainer; (2) add one-line subtitles to the Tool Kit and Home tiles that lack them (Breathwork, Energy and Mood, Wellness, Brain Dump, Routines, Stuck? Help), matching the voice of the existing HALT+ and Urge Log subtitles; (3) add a one-tap plain-language explainer for Presence wherever it is displayed in Weekly Review and Insights; (4) give the idle Focus box a verb instead of showing only the wall-clock time; (5) make Quick Capture hint text device-aware so touch devices do not read Esc instructions. Then in the breathwork technique data: replace the blanket evidence-based claim with per-technique framing, and add one caution line to techniques involving breath-holds. Then in renderThemeSelector, drop the Free/Pro badges while all themes are unlocked. Then update the landing CTA so it does not promise free open signup while signup is invite-gated. Then sync docs/legal/*.md to the shipped product — the health-privacy doc still describes classic HALT fields, references the removed kids chore tracker, and mentions streaks that do not exist — and re-run scripts/render-legal-docs.js. Plan the exact strings in plain English and show me before editing anything. Verify in-browser by rendering the affected modals, then give me the commit and the push command.”"],model:"Sonnet 5",effort:"Low — one afternoon at most, one commit, one web deploy. Ships to native on the next sync; nothing here justifies a native build of its own",status:"completed",completedAt:"2026-08-19",shippedCommit:"45bed68"},
{id:"ps-stage-2-panel-defaults-trust",panel:"recommendations",title:"Stage 2 of 9 — Panel render defaults and trust affordances",source:"Panel Survey: Suggestions for a Broader User Base, 2026-08-18 — outputs/Centerpost-Panel-Survey-Broader-Base-2026-08-18.docx. Eight personas (5 returning, 3 new), web + iOS build 92 + watchOS all exercised. Stage 2 of 9 — the smallest real code changes; do straight after Stage 1.",description:"Four small display-layer changes in legacy.js that share a theme: the app currently shows people a number where it should show them their data, or a scary state with nothing to click. Grouped because they are all render-path or status-path edits in the same file, none touch sync, and they can be verified in one browser session. Covers survey items I-1, I-5, I-6, J-1. I-1 is the single highest-value item in the whole survey by reach-per-effort and should be done first inside this stage.",steps:["I-1 — panels must render their data. With 2 active projects seeded, the Projects panel body renders EMPTY under the default filter, showing only “2 active” and a “Show all projects” checkbox; at 26 projects it does the same thing. Reminders behaves similarly, showing a count badge over an empty body. Verified at both volumes during the survey. Six of eight personas called it trust-breaking and several said it reads as data loss on first session; the Skeptic called it “a bug wearing a filter’s clothes”. Either default the filter to show active projects, or make the filter state visibly labelled. Container-scoped edits only — this is exactly where the Today/Everything duplicate-id bug class bites.","I-5 — make sync status interrogable. The footer status has no tap-through, no last-synced time, no pending-change count and no retry. The Very High Utilizer called it “the single scariest pixel in the app”; the ADHD User called persistent red an ambient alarm in a product that claims calm. Add a small popover: last synced, pending changes, retry, and one plain sentence about whether data is safe. Reserve red for data-loss-grade failures and use a neutral icon for transient ones. (Note for whoever reads the survey screenshots: the red “Sync error” visible there is an artifact of the survey’s auth stub, not a live bug — the missing affordance is the real finding.)","I-6 — disclose the caps before they bite. A user with 63 reminders gets 60 scheduled notifications and no indication which three will never fire. Check-ins cap at 500, which at several a day is a rolling two-month window on data the Insights panel implies is longitudinal. Show “60 of 63 scheduled — soonest first”, and footnote the chart when the check-in window has rolled. Silent truncation of self-tracking data is a trust breach for exactly the most invested users.","J-1 — Tool Kit order, with the owner’s layout preserved. Music and Streaming currently occupy the top row of the regulation toolkit for every user. All eight personas flagged it; the Clinician called tile ordering “a clinical signal, not cosmetics”, the Shift Worker called it the clearest built-for-himself tell on any screen. Gate those two tiles behind the existing owner/admin flag in userProfile so Joe’s own layout is untouched, and put the regulation tools first for everyone else.","PROMPT FOR CLAUDE CODE — paste this: “Read ~/dev/productivity-dashboard/CLAUDE.md first, including the known recurring bug classes. Four display-layer fixes from the 2026-08-18 panel survey, all in public/legacy.js plus the relevant React components. (1) The Projects panel renders an empty body under its default filter even when active projects exist — verified at 2 projects and at 26 — and Reminders shows a count badge over an empty body. Make the default show the user their data, or label the filter state so an empty body is never ambiguous. Keep every DOM query container-scoped: this panel renders in both Today and Everything and has a documented duplicate-id regression class. (2) Make the sync status indicator tappable: last-synced time, pending-change count, a retry, and one plain sentence on whether data is safe; use a neutral icon for transient states and reserve red for data-loss-grade failures. (3) Surface the 60-scheduled-notification cap in the Reminders panel as a soonest-first count, and footnote the check-in chart when the 500-entry window has rolled. (4) Move the regulation tools to the top of the Tool Kit and show the Music and Streaming tiles only for the owner account, using the existing admin/owner flag on userProfile — do not remove them. Plan in plain English first and wait for my go-ahead. Verify each one in the browser at both small and large data volumes before you call it done, then give me the commit and the push command.”"],model:"Sonnet 5",effort:"Low-Medium — I-1 and J-1 are under an hour each; I-5 is the biggest piece at roughly half a day",status:"completed",completedAt:"2026-08-19",shippedCommit:"8984a75"},
{id:"ps-stage-3-safety-clinical",panel:"recommendations",title:"Stage 3 of 9 — Safety and clinical posture in the Tool Kit",source:"Panel Survey: Suggestions for a Broader User Base, 2026-08-18 — outputs/Centerpost-Panel-Survey-Broader-Base-2026-08-18.docx. Eight personas (5 returning, 3 new), web + iOS build 92 + watchOS all exercised. Stage 3 of 9 — the Clinician’s preconditions and the Skeptic’s safety flags. Small, and it gates outside recommendation.",description:"Everything here lives in the regulation tools and is what a clinician said they would need before handing the app to a client. Grouped because it is one coherent pass over the same three modals plus the journal gate, and because the content mostly already exists — this is placement and copy discipline, not new therapeutic material. Covers survey items A-4, J-4, J-5, I-8, A-14. IMPORTANT: none of this reopens the 988 trigger threshold — that was your decision on 2026-08-09 and it stands; A-4 adds a second passive path alongside it.",steps:["A-4 — persistent crisis access plus an in-app “what this is and what it isn’t” card. The disclaimer content is already written and both new personas rated it genuinely good; the problem is that it lives at Settings → About &amp; Legal, where nobody in a hard moment will find it. Add a Tool Kit entry and a small footer link inside the Breathwork, Urge Log and Grounding modals. This was the Clinician’s stated precondition to recommending the app and the Skeptic’s top ask, and the Shift Worker’s framing was that first responders are the population that opens an app at 0300 after a bad call.","J-5 — Urge Log: hideable categories plus one line of scoping copy. The Clinician flagged that a delay timer on eating is contraindicated for restrictive-eating patterns, and that hideable categories solve it without policing anyone’s use. The Skeptic flagged that the free-text “Other” silently accepts safety-relevant urges where a five-minute timer is not an adequate response — the fix is copy-level scoping (“for everyday impulses — for urges involving your safety, tap Crisis resources”, linking to A-4), explicitly NOT keyword scanning, which would be a privacy problem. The equal-outcome scoring stays exactly as it is: both personas praised it as the strongest no-shame design in the app.","J-4 — HALT+: add a connection item, keep yours. Both the Clinician and the Skeptic flagged that dropping “Lonely” — the load-bearing letter for anyone who learned HALT in treatment — for “Late/Behind” is a real clinical deviation, and that some clients will read its absence as permission not to check it. Your R13 wording decision stands: the resolution is additive — keep Late/Behind, add a Lonely/Disconnected item, allow items to be hidden using the same mechanism as J-5, and sync the health-privacy doc to whatever ships.","I-8 — journal PIN: make unrecoverability unmissable. Three personas independently called this the most likely data-loss event in the product; the Clinician called it “a predictable grief event” for a working-memory-impaired population. The encryption design itself was praised by everyone — this is presentation only. At PIN creation: plain-consequence copy BEFORE the first save, a deliberate confirmation, and an immediate biometric-enrollment offer on native (the bridge already exists).","A-14 — Urge Log personal base rate. After enough outcomes, show the user their own numbers (“your urges passed 14 of 19 times”) plus an optional one-tap “what helped”. The Skeptic’s point is that personal evidence is the actual active ingredient of urge delay, so this makes the pause self-reinforcing without adding any gamification. Aggregate client-side from the existing urge check-in records; no schema change.","PROMPT FOR CLAUDE CODE — paste this: “Read ~/dev/productivity-dashboard/CLAUDE.md first. This is the safety-and-clinical pass from the 2026-08-18 panel survey. Do NOT change the 988 breathwork threshold — that is a settled decision. (1) Add a persistent Crisis resources entry to the Tool Kit and a small footer link inside the Breathwork, Urge Log and Grounding modals; reuse the content that already exists in the disclaimer doc, and on native open it through the existing in-app browser bridge. Add an in-app what-this-is-and-what-it-is-not card in the same place. (2) In the Urge Log, make the urge categories hideable from Settings, and add one line of scoping copy pointing safety-relevant urges to the crisis resources — copy only, absolutely no keyword scanning of what the user typed. Leave the equal-outcome scoring exactly as it is. (3) In HALT+, add a Lonely/Disconnected item alongside Late/Behind, make items hideable with the same mechanism, and update docs/legal to match whatever ships. (4) At journal PIN creation, state in plain language before the first save that a forgotten PIN cannot be recovered and the entries are unreadable, require a deliberate confirmation, and offer biometric enrollment immediately on native. (5) In the Urge Log outcome step, show the user their own pass rate computed from existing check-in records, plus an optional one-tap what-helped note — client-side only, no schema change. Plan it in plain English and wait for my approval before editing. Tell me exactly how to verify each one.”"],model:"Sonnet 5",effort:"Medium — roughly a day. A-4 alone is under an hour and is the piece that unblocks clinician referrals",status:"completed",completedAt:"2026-08-19",shippedCommit:"5a4e0e8"},
{id:"ps-stage-4-front-door-first-run",panel:"recommendations",title:"Stage 4 of 9 — The front door and the first five minutes",source:"Panel Survey: Suggestions for a Broader User Base, 2026-08-18 — outputs/Centerpost-Panel-Survey-Broader-Base-2026-08-18.docx. Eight personas (5 returning, 3 new), web + iOS build 92 + watchOS all exercised. Stage 4 of 9 — the unanimous top finding. Everything before this is polish nobody new can reach.",description:"The one thing all eight personas agreed on: nobody can get in. Grouped because these all live on the same path — landing, auth, first launch, first screen — and because fixing any one of them alone leaves the others as the new bounce point. Covers survey items A-1 (the real half), J-2, I-2, I-3, A-15. The access decision itself is yours: the survey does not assume open signup, only that the promise and the wall stop contradicting each other.",steps:["A-1 — self-serve access, your choice of shape. Minimum viable: a waitlist that captures an email and says plainly when access opens. Full version: open signup, which needs abuse throttling, a support surface and a firestore.rules review first. Both new personas bounced at the invite wall inside two minutes; the Clinician cannot refer a client to an invite code and an expiring TestFlight build, and the Skeptic’s structural point is that no open access also means no base-rate evidence about anything else in the product.","J-2 — retire or gate the “First-time setup” side door. Every persona read it as UX confusion, but the surveyor flags it separately as an access-control issue: it creates an account with admin:true outside the invite flow, and how safe that actually is depends entirely on firestore.rules. Hide or rename it in the production UI AND audit the users-collection create rule. Do this before any opening of signup, not after. The rules audit is the one security-sensitive piece in this stage — worth Opus.","I-2 — iOS first launch: value before auth. The app currently opens a Sign In modal with the keyboard already raised, over a blurred landing, before showing a single screen of the product; behind it is a nearly blank page whose headline appears twice in a row. The College Student called it the most hostile first screen they had seen this year. Land on the content expanded, keep Sign In one tap away, drop the auto-focus and auto-keyboard, fix the duplicated headline, and fix the signup modal’s focus order — it currently focuses the email field and skips the invite-code field above it, while the keyboard covers the explanation of why a code is needed.","I-3 — replace the tour with three anchored just-in-time hints. Half the panel wanted the eight cards anchored to real UI; the other half said any eight-card tour gets skipped regardless. Both camps land on the same mechanism: three contextual hints (first Today visit, first Tool Kit open, first capture) using the FAB-hint pattern that already exists, with the full tour kept as a replayable Settings reference. Move the Support Level step to the moment the first auto-popup would actually fire, when the user can see what it controls — today it asks the question at step 6, before the user has been told what a Grounding Session is.","A-15 — one starter template, “Just the basics”, fully declinable. Four personas asked; the Skeptic’s scope cut is adopted (one template, not four) because seeded content becomes clutter people will not delete. The “Student semester” and “Shift rotation” templates wait for Stage 9, so they can set day anchors rather than just seeding tasks. Make it deletable in one sweep once Stage 6 lands.","PROMPT FOR CLAUDE CODE — paste this: “Read ~/dev/productivity-dashboard/CLAUDE.md first. This is the front-door work from the 2026-08-18 panel survey; it is the highest-stakes user-facing change on the list, so plan all of it in plain English and wait for my approval before touching a file. (1) Access: I will tell you whether I want a waitlist or open signup — build only what I choose. If open signup, first audit firestore.rules for the users-collection create rule and report what you find before writing any code. (2) Regardless: hide or rename the First-time setup link in the production UI, and audit doSetup in public/legacy.js, which creates an account with admin true outside the invite flow — tell me whether the rules actually block that today. (3) iOS first launch: land on the What is Centerpost content expanded with Sign In one tap away, no auto-raised keyboard, no auto-focus, fix the duplicated headline, and fix the signup modal focus order so the invite-code field is focused first and its explanation is not covered by the keyboard. (4) Replace the 8-card onboarding tour with three anchored just-in-time hints — first Today view, first Tool Kit open, first capture — reusing the existing FAB-hint pattern, and keep the full tour replayable from Settings. Move the Support Level question to the moment the first auto-popup would fire. (5) Add one optional Just the basics starter template on the first-run path, fully declinable. Verify the iOS pieces in the simulator and tell me what you could not verify.”"],model:"Mixed — Opus 5 for the firestore.rules audit and any real opening of signup (security-sensitive, and it touches account creation); Sonnet 5 for the first-launch, tour and template work",effort:"Medium overall — the waitlist and the copy alignment are small; open signup with an abuse and rules review is the multi-session piece",status:"completed",completedAt:"2026-08-19",shippedCommit:"884359b"},
{id:"ps-stage-5-capture-and-search",panel:"recommendations",title:"Stage 5 of 9 — Capture and search: the input paths",source:"Panel Survey: Suggestions for a Broader User Base, 2026-08-18 — outputs/Centerpost-Panel-Survey-Broader-Base-2026-08-18.docx. Eight personas (5 returning, 3 new), web + iOS build 92 + watchOS all exercised. Stage 5 of 9 — the two fastest surfaces in the app, and where the power seat hits the ceiling first.",description:"Capture and search are one work type: both are the fast paths into and out of the data, both are guarded by the same two known regression classes, and both were named by opposite ends of the panel for opposite reasons. The resolution the survey reached is that the heuristic stays the only default and everything added is opt-in or passive — so nobody has to learn anything new. Covers survey items I-9, I-10, A-10.",steps:["I-9 — capture verdict toast, plus opt-in syntax. Quick Capture silently decides Task versus Brain Dump thought; the hint text literally says task-like text becomes a Task, otherwise a thought. The ADHD User reopens panels to check where things landed; the High-Functioning User called it “a black box I audit later”. Fix for both seats with one passive mechanism: a toast after save that states the verdict with a one-tap flip (“Saved as Task · make it a Thought?”). Then add opt-in deterministic tokens — a project tag and an explicit type prefix — in quick-add-parser.js, which is a pure module with existing tests. Extend the live parse-preview chip that already exists in the add-forms to Quick Capture. The heuristic remains the only default: tokens do nothing unless typed.","I-10 — make search results actionable. Omnisearch finds things instantly at 1,200+ items but the results are jump-links, so the fastest surface in the app hands you back to the mouse. Add arrow/j-k navigation, Enter to open, modifier-Enter to complete, and an inline date change. Route every mutation through the same guarded paths the panels use — the onSnapshot inline-edit clobber guard applies here. Also add recents to the zero-state (three seats asked; the Skeptic ranked it last and called the mechanism thin, which is why it is the garnish and not the point).","A-10 — search query tokens and saved filters. Overdue, due-this-week, by project, no-date, plus pinnable saved filters. The High-Functioning User’s framing is that there is currently no way to ask the system a question at all — the panel sort dropdowns are the entire query surface. Parse tokens inside the existing omnisearch entry point; keep result actions container-scope-safe. This pairs directly with Stage 6’s bulk actions: query, then act on the whole result set.","PROMPT FOR CLAUDE CODE — paste this: “Read ~/dev/productivity-dashboard/CLAUDE.md first, especially the two known regression classes (duplicate DOM ids across Today and Everything, and the onSnapshot inline-edit clobber). From the 2026-08-18 panel survey. (1) After a Quick Capture save, show a toast stating whether it became a Task or a Brain Dump thought, with a one-tap flip to the other type. Use the existing toast and accessibility-announcer plumbing. (2) In public/quick-add-parser.js, add opt-in tokens for a project tag and an explicit task-or-thought prefix, with tests alongside the existing ones. The current heuristic must remain the only default — tokens do nothing unless typed. Extend the existing live parse-preview chip to the Quick Capture box. (3) In the command palette and the phone search tab, add keyboard navigation over results, Enter to open, modifier-Enter to complete, and an inline due-date change; route every mutation through the same guarded paths the panels use so the onSnapshot guard still applies, and keep all DOM wiring container-scoped. Add recently-touched items to the empty-query state. (4) Add query tokens to omnisearch — overdue, due within a week, by project, no date — and let a query be pinned as a saved filter. Plan in plain English first, wait for my go-ahead, and verify at both small and 1,200-item volumes.”"],model:"Sonnet 5 — Opus 5 if you want the palette mutation paths reviewed, since they touch the clobber-guard class",effort:"Medium — the toast is under an hour, the parser tokens and the actionable palette are roughly a day each",status:"open",completedAt:null},
{id:"ps-stage-6-volume-and-honest-reporting",panel:"recommendations",title:"Stage 6 of 9 — Volume, archive and honest reporting",source:"Panel Survey: Suggestions for a Broader User Base, 2026-08-18 — outputs/Centerpost-Panel-Survey-Broader-Base-2026-08-18.docx. Eight personas (5 returning, 3 new), web + iOS build 92 + watchOS all exercised. Stage 6 of 9 — year-two survival. First stage where the sync invariants are genuinely at risk.",description:"These four share a work type: they are all about what happens when the account gets big, and two of them mutate many items at once, which puts them squarely inside the sync/tombstone invariants. The survey verified the app RENDERS at volume (1,206 tasks, 303 thoughts, 26 projects, 401 days of mood data, all fine) — what it found missing is any way to LIVE at volume. Covers survey items A-8, A-9, I-7, I-13. Read the Sync invariants section of the repo CLAUDE.md before starting; every batch mutation here needs a case in test/sync-merge.test.mjs.",steps:["A-8 — bulk operations, with two different doors onto the same mechanism. The High-Functioning User wants multi-select with bulk reschedule, complete, delete and move-to-project — at 1,300 tasks their weekly maintenance sweep is currently one item at a time, and they called it the single biggest speed gap versus their current system. The ADHD User wants exactly one pre-shaped offer after a lapse: a “fresh start” sweep (move all to today, keep top 3, push the rest to someday) — they identified the overdue wall as the single biggest re-entry abandonment risk, and noted that reminders got a bulk-triage popup while tasks got nothing. Same batch engine, two entry points. Batch mutations must be ONE save() and tombstone-correct; selection UI must be container-scoped.","A-9 — archive and cleanup. 2,200 completed tasks, hundreds of stale thoughts, and tombstones that by design never stop growing. Add an “older than N days” sweep for completed tasks and thoughts, following the existing remindersArchive precedent — archive, never raw deletion, because deletion is a synced fact. The Very High Utilizer’s summary: “scale rendering verified; scale living not yet designed.” The 90-day tombstone-purge Worker already sketched in the repo docs is the server-side tail of this and can follow separately.","I-7 — honest Insights. Two contradictory auto-insights appeared in the same modal during the survey: a banner saying mood is “fairly steady regardless of usage” directly above a lightbulb claiming low-usage days coincide with lower mood. Suppress whichever claim the correlation does not actually support. Separately, the Skeptic showed Presence points leak into the regulation tools, which makes the tool-use-versus-Presence correlation partly definitional — exclude regulation-tool events from the correlation series and delete the “earn Presence” nudge copy. Display-layer only: no stored points are touched, and whether regulation tools keep earning Presence at all is your call, not the panel’s (see the survey’s section 8).","I-13 — mood history beyond 30 days, aggregated. The data provably handles 400+ days but only 7- and 30-day windows exist, and the 30-day daily line is already an unreadable zigzag. Add a 90-day view using weekly averages rather than daily points. Asked for by the Utilizer, the Clinician (seasonal and medication-change patterns) and the Student (a semester-length window); the Basic User voted to drop it, which is why it sits at the bottom of this stage.","PROMPT FOR CLAUDE CODE — paste this: “Read ~/dev/productivity-dashboard/CLAUDE.md first and read the Sync invariants section twice — this stage mutates many items at once. From the 2026-08-18 panel survey. (1) Add multi-select to the task and reminder lists with bulk reschedule, complete, delete and move-to-project. Every batch must be a single save() and must record tombstones correctly for deletes and completions; add cases to test/sync-merge.test.mjs and run npm run test:sync. All selection DOM wiring must be container-scoped — these rows render in both Today and Everything. (2) Using the same batch engine, add a one-tap fresh-start sweep for a big overdue backlog, offering move-all-to-today, keep-top-3, or push-the-rest-to-someday. (3) Add an archive sweep for completed tasks and thoughts older than N days, following the existing remindersArchive pattern — archive, never raw delete. (4) In Insights, suppress an auto-insight when the correlation does not support it — two contradictory claims currently render in the same modal — exclude regulation-tool events from the Presence correlation series, and remove the earn-Presence nudge copy. Do not change any stored point values. (5) Add a 90-day mood view using weekly averages rather than daily points. Plan in plain English, wait for approval, and show me the sync-merge test output before you call any of it done.”"],model:"Opus 5 for the bulk mutations and the archive sweep (tombstones plus the duplicate-id class); Sonnet 5 for the Insights copy and the 90-day chart",effort:"Medium-High — the bulk engine and archive are multi-session; the Insights and chart pieces are an afternoon",status:"open",completedAt:null},
{id:"ps-stage-7-import-and-recurrence",panel:"recommendations",title:"Stage 7 of 9 — Import and real-world recurrence",source:"Panel Survey: Suggestions for a Broader User Base, 2026-08-18 — outputs/Centerpost-Panel-Survey-Broader-Base-2026-08-18.docx. Eight personas (5 returning, 3 new), web + iOS build 92 + watchOS all exercised. Stage 7 of 9 — what a switcher needs on day one. Only worth doing once Stage 4 lets switchers in.",description:"Both items are about arriving with a life already in progress: one imports what you had, the other describes schedules the current engine cannot say. They share the parser and recurrence code and the same test discipline, so they batch well. Deliberately sequenced AFTER the front door, because import matters the moment someone can actually sign up and not before. Covers survey items A-5 and A-16.",steps:["A-5 — paste-a-list and CSV import. The High-Functioning User’s number one ask and the difference between a trial and no trial; the Student has two years in Todoist; the Basic User asked for the same thing in plainer words (“let me paste my list from Notes”). Scope is deliberately cut per the Skeptic: paste and CSV only, no per-service APIs until someone actually asks. Reuse parseQuickAdd per line — quick-add-parser.js is already a pure module with tests. All client-side, one save() at the end. The Utilizer’s caveat: verify round-trip fidelity at 1,000+ rows, with a sync-merge test for a large import.","A-16 — multi-weekday recurrence with end dates. “MWF 10am” is the Student’s actual reality and the current engine cannot express it — it has specific-weekday and N-interval repeats but no day-sets and no until-date, so a class schedule makes the timeline permanently wrong and the Today view stops being trusted. Extend the existing recurrence patterns with day-sets and an until date, add parser tokens (“every mon wed fri until Dec 12”), and add engine cases beside the existing recurrence tests. This also serves standing shifts and recurring appointments, not just students.","PROMPT FOR CLAUDE CODE — paste this: “Read ~/dev/productivity-dashboard/CLAUDE.md first, including the Sync invariants. From the 2026-08-18 panel survey. (1) Add an import path that accepts either a pasted plain-text list (one item per line) or a CSV, mapping Todoist-style export columns where present. Reuse parseQuickAdd per line so dates and recurrence carry over, show a preview of what will be created before committing, and write everything in a single save(). Add a sync-merge test case for a 1,000-row import and run npm run test:sync. Verify round-trip fidelity by exporting after importing and comparing. No third-party APIs — paste and CSV only. (2) Extend the recurrence engine to support multi-weekday sets (for example Monday/Wednesday/Friday) and an until-date, add matching quick-add parser tokens, and add engine test cases beside the existing recurrence tests. Confirm the timeline auto-placement renders these correctly for a full week. Plan in plain English and wait for approval before editing.”"],model:"Sonnet 5",effort:"Medium — roughly a day each, both with mandatory test coverage",status:"open",completedAt:null},
{id:"ps-stage-8-native-glance",panel:"recommendations",title:"Stage 8 of 9 — Native glance surfaces (lock screen, watch, Siri)",source:"Panel Survey: Suggestions for a Broader User Base, 2026-08-18 — outputs/Centerpost-Panel-Survey-Broader-Base-2026-08-18.docx. Eight personas (5 returning, 3 new), web + iOS build 92 + watchOS all exercised. Stage 8 of 9 — all Swift, one native ship. Batch it so it costs one Archive, not four.",description:"Four native items grouped because they are the same work type — Swift in the Capacitor project, reading the App Group snapshot that already exists — and because each one alone would not justify a TestFlight build. The data plumbing is largely built already: the widget snapshot carries today and tomorrow, the watch session is live, the capture queue works. This is rendering, registration and one new bridge case. Covers survey items A-7, A-6, A-11, A-12. Use the centerpost-ship-native checklist: build numbers must match across app, watch app, widget, complication and share extension.",steps:["A-7 — lock-screen widgets plus a “next block” complication. The Shift Worker named exactly what earns lock-screen placement: next timed thing plus a count of today’s remaining items, glanceable one-handed in 30 seconds. The Student said the lock screen is where their generation lives. Add accessoryRectangular and accessoryCircular families to the existing FocusTimerWidget target reading the same TodaySnapshot, and add a second complication kind beside the timer one.","A-6 — read/query Shortcuts intents plus an interactive widget complete button. Six personas asked. Today there is exactly one intent and it only writes. “Hey Siri, what’s next” answered from the App Group snapshot needs no web layer at all. The completion button must write back through a pending-completions queue drained by legacy.js (mirroring the existing capture-queue pattern in reverse) so tombstone rules are respected — do NOT mutate the snapshot alone. Widget interactivity needs iOS 17+; gate it and keep the tap-through for older.","A-11 — watch: one-tap combined check-in, and sync the watch HALT check. The fastest check-in today is six-plus interactions (menu, scroll, Toolkit, Mood &amp; Energy, two picks); on scene the Shift Worker gets two, and set the bar at under five seconds or it does not happen. Add a 2x4 energy+mood grid as the first menu item and as a complication tap target, sending one message that calls the existing check-in logger on the phone. Also stop keeping the watch HALT check @State-only — it currently evaporates, which the Shift Worker called out as losing exactly the 0300 hallway check-in it exists for.","A-12 — “Reset after a call” guided chain. Ninety-second physiological sigh, then an optional ten-second dictated brain dump, then done and logged as one check-in. The Shift Worker’s framing: the pieces all exist but you have to assemble them while cooked, and this is “the feature only this builder could ship”. It chains existing cited techniques — no new therapeutic content, which keeps it inside the Stage 3 safety posture.","PROMPT FOR CLAUDE CODE — paste this: “Work in the Capacitor project at /Users/jhmac/Desktop/git hub productivity (quote the path, it has spaces). Read the repo CLAUDE.md and the centerpost-ship-native checklist first. From the 2026-08-18 panel survey, four native items to ship in ONE build. (1) Add accessoryRectangular and accessoryCircular families to the existing FocusTimerWidget target, rendering the next timed item plus a count of today’s remaining items from the TodaySnapshot already in the App Group; add a matching next-block watch complication kind alongside the existing timer one. (2) Add read/query App Intents answering what is next and how many are overdue from the same snapshot, and an interactive widget complete button gated to iOS 17 and above with the tap-through preserved below it — completions must go through a pending-completions queue drained by legacy.js, mirroring the existing capture queue in reverse, so tombstones are recorded correctly; never mutate the snapshot alone. (3) On the watch, add a one-tap combined energy-plus-mood check-in grid as the first menu item and as a complication tap target, and make the watch HALT check sync to the phone instead of being local @State. (4) Add a Reset after a call flow chaining the existing physiological-sigh session and watch Brain Dump dictation, logging one check-in — no new therapeutic content. Verify what you can in the simulator, then tell me exactly what needs on-device confirmation and give me a numbered on-device test script. Confirm build numbers match across app, watch app, widget, complication and share extension before I archive.”"],model:"Sonnet 5 (Swift)",effort:"Medium — roughly two days of work, one TestFlight build, and an on-device confirmation pass from you",status:"open",completedAt:null},
{id:"ps-stage-9-day-model",panel:"recommendations",title:"Stage 9 of 9 — The day model (anchor, then rotation)",source:"Panel Survey: Suggestions for a Broader User Base, 2026-08-18 — outputs/Centerpost-Panel-Survey-Broader-Base-2026-08-18.docx. Eight personas (5 returning, 3 new), web + iOS build 92 + watchOS all exercised. Stage 9 of 9 — LAST on purpose. Highest blast radius in the survey; the Shift Worker’s whole seat depends on it.",description:"This is the riskiest work on the list and it is deliberately sequenced last. Changing what “today” means rewrites the single assumption every other feature rests on: todayStr and the date-utils invariants, recurrence, timeline auto-placement, the reminders popup’s once-per-day key, notification scheduling, AND the native widget’s own dayKey — and if the widget and legacy.js disagree, the widget shows a different “today” than the app. Covers survey items A-2, A-13, J-6, A-3. Ship it in the four sub-steps below, in order, verifying each before starting the next. The default day behaviour must not move for existing users at any point.",steps:["STEP 1 (small, independent — can be pulled forward any time): A-13 deadline countdown. Tasks due within 24 hours show a live relative countdown (“due in 6h”) instead of a static date, plus the nearest deadline in the widget. The Student named this the thing that would get them back on day two. Keep it calm — a countdown, not a red alarm; the no-shame rules still apply. Display-layer only, no dependency on anything else in this stage.","STEP 2 (small, high value): configurable weekly-review day. Currently hardcoded to Sunday in the native notification scheduler, which is a shift day one week in three for the Shift Worker, who will dismiss it on scene and never come back. This is one weekday parameter plus a Settings row — ship it on its own and confirm it before touching anything harder.","STEP 3 (the real work): A-2 configurable day anchor. One state value (a minutes offset) read by todayStr and the date-utils helpers, MIRRORED into the widget snapshot so the widget’s dayKey matches. Fixes five of the Shift Worker’s eight documented breakpoints at once, and also serves the Student’s 11:59pm deadlines and the ADHD User’s 1am false-overdue shame. Default stays exactly today’s behaviour; the anchor is opt-in per account. Requires sync-merge test cases and an explicit widget-parity check before anyone flips it.","STEP 4 (opt-in layer, only after Step 3 is confirmed on device): A-3 rotation profile plus J-6 shift-day language. Define a repeating pattern (24 on / 48 off from an anchor date, with night-swap weeks) and let everything time-based read the day type from it: routine nudges keyed to wake rather than a clock time, quiet-hours profiles per day type, timeline auto-placement off on shift days, and — J-6 — items dated to a shift day rolling forward as “moved from shift day” rather than “overdue”. On a 24/48 rotation a third of all days currently generate overdue-shaped guilt by design; the app already refuses streak-shame in days-shown-up, and this extends that philosophy to the one list where it breaks.","PROMPT FOR CLAUDE CODE — paste this: “Read ~/dev/productivity-dashboard/CLAUDE.md fully, including Sync invariants and the note about local-day handling — this is the highest blast-radius change on my list, from the 2026-08-18 panel survey. Do it in four separate commits, and stop after each for my confirmation. Commit 1: show tasks due within 24 hours as a calm live countdown instead of a static date, and surface the nearest deadline in the widget — display only, calm not alarming. Commit 2: make the weekly-review day configurable instead of hardcoded Sunday — one parameter in the native notification scheduler plus a Settings row. Commit 3: add a configurable day anchor as a minutes offset in state, read by todayStr and the date-utils helpers, and mirror it into the widget snapshot so the native widget dayKey resolves the same day the app does — the DEFAULT MUST REMAIN EXACTLY TODAY’S BEHAVIOUR and the anchor must be opt-in per account. Add sync-merge test cases, run npm run test:sync, and prove widget parity explicitly rather than assuming it. Commit 4, only after I confirm commit 3 on device: add an opt-in repeating shift-rotation profile (for example 24 on, 48 off from an anchor date) that drives routine nudge timing, quiet-hours per day type, and timeline auto-placement, and make items dated to a shift day roll forward labelled as moved from a shift day rather than overdue. Before you write anything, list every place in the codebase that resolves the current day and tell me which ones you will touch.”"],model:"Opus 5 — cross-cutting, touches the date invariants, recurrence, notifications and the native widget together",effort:"High — multi-session. Steps 1 and 2 are each under an hour and worth shipping on their own; Step 3 is the real work; Step 4 is a separate opt-in layer after Step 3 is confirmed on device",status:"open",completedAt:null},
{id:'kids-mode-separation',panel:'work',title:'Kids Mode separated from the product entirely — and G-06 closed',source:'Joe’s call, 2026-08-11 — to remove a step from App Store approval (kids apps + children’s data storage). Supersedes R13.5, which only went half way. Web 7d6765d, sync script e59b17c; CONFIRMED ON DEVICE build 86, 2026-08-11.',description:'Kids Mode is no longer part of either app. The headline finding: R13.5 had hidden every native entry point, but kids.html (189 KB) and its 5 assets were still physically shipping INSIDE the iOS bundle — and a reviewer reads the bundle, not the UI. Hiding buttons was never going to clear the Kids Category question; removing the files does. kids.html still exists and still works as a standalone page at centerpost.app/kids.html, unlinked, on the teacher.html model.',steps:['Native bundle: centerpost-sync.sh now deletes all 6 kids files from WWW/ on every sync (rsync --delete restores them each run, so it has to re-run), with a hard stop if the deletion ever fails rather than silently shipping it','Web app entry points removed: the Settings “Kids Mode” section, openKidsMode(), and 4 landing-page references (hero CTA, feature card, footer link, nav link)','Service worker: kids.html, its manifest, its 4 icons and the kids-only Press Start 2P/VT323 fonts dropped from the precache — the app has no business caching a page it no longer links to','How To: section 15 removed and sections 16–17 renumbered; verified all 16 sections and TOC links still resolve with no gap','Docs updated: privacy policy COPPA section, data-inventory §1.5, app-store-compliance Kids Category row, COMPLIANCE-GAPS G-06','CONFIRMED ON DEVICE build 86: no Kids section in Settings, no Kids links on the sign-in/landing screen, nothing broken where it used to be — and kids.html still loads and still syncs standalone in Safari at centerpost.app/kids','FOLLOW-UP SAME DAY — G-06 now fully CLOSED (web 98caa02): the account sync was removed too. The ~316-line Firebase block, the 3 SDK script tags and config.js are gone from kids.html; it writes nothing to users/{uid}/data/kids and makes no data request at all. Also purges personal data rather than just ceasing to write it — state.sync held the PARENT’S EMAIL in localStorage, and it plus _kidsParentUid/_kidsParentEmail are now deleted on load and stripped from restored backups. Cross-device is the manual backup file that already existed','Legacy users/{uid}/data/kids docs left alone on purpose: nothing writes to them, ‘kids’ stays in USER_DATA_DOCS so they’re still erased on account deletion, and the privacy policy carries a historical note','CLOSED — one bookkeeping item rides the next native build, nothing functional. kids.html isn’t in the iOS bundle at all, so the G-06 change needs no ship; and Settings → About & Legal opens the LIVE centerpost.app/privacy, so native users already see the updated COPPA wording. The only stale artifact is the unused bundled copy of privacy.html sitting in build 86, which the next sync refreshes. Worth noting rather than ignoring: a stale legal doc inside the binary is exactly the “inspect the bundle, not the UI” class of thing that hid the kids.html problem in the first place'],model:'Sonnet 5',effort:'Done — one unused bundled file refreshes on the next native sync',status:'completed',completedAt:'2026-08-11'},
{id:'zindex-confirm-and-toast',panel:'work',title:'Two stacking-order bugs found testing build 84/85 — confirm dialog and toasts',source:'Found by Joe on-device while testing the G-05 fix, 2026-08-11. Web f2a61cf + dfca9dc; confirm fix CONFIRMED ON DEVICE build 85, toast fix CONFIRMED ON DEVICE build 86.',description:'Both are the same failure: a layer that gets raised FROM other surfaces was sitting BELOW them, so it opened invisibly. Neither loses data, but the second one can make a failure look like nothing happened.',steps:['Confirm dialog: _confirm() is z-1100 but is raised from Settings (z-1400) and the gcal modal (z-2000). Settings → Delete my account opened its own confirmation behind the Settings sheet — open and taking taps, just invisible. Now z-2500. The comment justifying Settings at 1400 claimed “account delete uses native confirm”; it never did','Toasts: .toast was z-999 — below EVERY overlay in the app. Settings hid its own “Export downloaded”, “Export failed” and “Account deleted” toasts. .toast.update-toast had already been bumped to 10002 for this exact reason, but only that one instance was ever fixed. Base .toast now 9500','Both verified at the CSSOM level rather than by eye — matching rules walked to confirm which one wins and that no ancestor creates a stacking context, per the safe-area-inset lesson (a “verified” CSS fix that was actually a dead rule losing a specificity tie)','Joe confirmed the confirm-dialog fix on device in build 85, plus a regression pass on journal/task/reminder confirms','Toast fix confirmed on device in build 86: Settings → Export my data now shows its “Preparing your export…” and “✓ Export downloaded” toasts, which were invisible in 85'],model:'Sonnet 5',effort:'Done',status:'completed',completedAt:'2026-08-11'},
{id:'r8-journal-faceid-native',panel:'work',title:'Journal Face ID unlock (native) — confirmed on device',source:'R8 phase 2, shipped 2026-07-31 (web a2a8657, native 447d32f, build 60); backfilled here 2026-08-09 — this page didn’t exist yet when it originally shipped',description:'Face ID/Touch ID unlocks the encrypted journal on native — the AES key is held in the device Keychain behind biometrics after a PIN unlock, so day-to-day opening is one glance instead of retyping the PIN. Not the same thing as native account sign-in (that’s a separate, still-open item below) — this only unlocks an already-signed-in device’s journal. JS side proven via a stubbed-native-Keychain technique; real Face ID confirmed on device by Joe at the time, and reconfirmed 2026-08-09.',steps:['Proven end-to-end: PIN unlock stores the key in Keychain (kSecAttrAccessibleWhenUnlockedThisDeviceOnly, .biometryCurrentSet)','Next journal open prompts Face ID instead of the PIN','A changed enrolled biometric invalidates the stored key — falls back to PIN, no server escrow'],model:'Sonnet 5',effort:'Done',status:'completed',completedAt:'2026-08-09'},
{id:'r10-complication',panel:'work',title:'R10 — watch face Timer complication: confirm on-device',source:'Senior design review 2026-07-28 · R10, built 2026-07-31',description:'The WidgetKit complication for the Focus Timer is built and compiles clean (BUILD SUCCEEDED, correctly embedded in both bundle locations), but has never actually run on a real watch face.',steps:['Run centerpost-sync, then Xcode Archive, then TestFlight','Open Signing & Capabilities for the new CenterpostWatchComplication target (and re-check the watch app’s) — new App Groups don’t always self-provision','Add the complication to a real watch face from the Watch app, or by long-pressing the face','Start a Focus Timer and confirm the complication counts down live','Let it finish or reset it, confirm it reverts to Idle'],model:'Sonnet 5',effort:'Low — verification only, code already exists',status:'completed',completedAt:'2026-08-04'},
{id:'r7-archive-sweep',panel:'work',title:'R7 Ship-3 — confirm reminder archive auto-sweep on a real device',source:'Senior design review 2026-07-28 · R7 Ship-3, shipped native build 57',description:'Reminders older than 7 days should auto-archive on the daily rollover tick. Verified against boundary-exact test data and the sync-merge suite, and now confirmed on a real device — a reminder past the 7-day mark landed in the collapsed Archived folder after rollover, not the live list.',steps:['Find or create a reminder with a due date more than 7 days in the past','Let the app sit through a day rollover, or fake the device date forward a day','Confirm it lands in the collapsed "Archived" folder, not still in the live list'],model:'Sonnet 5',effort:'Low — on-device check only, no new code',status:'completed',completedAt:'2026-08-09'},
{id:'988-threshold',panel:'decisions',title:'Is the 988 crisis-line trigger (3 resets/hour) right for shift workers? — Decided: raised to 5',source:'Persona panel 3, 2026-08-02 — surfaced 2026-08-02, decided 2026-08-09',description:'The breathwork-frequency safety net showed one dismissible 988 line after 3 resets in a rolling hour. The ER-nurse persona flagged that 3 resets/hr can be normal for someone mid-shift — Joe’s call was to loosen the threshold rather than make it context-aware. Raised to 5 (BREATH_RESOURCE_THRESHOLD in legacy.js), shipped web.',steps:['Decided: raised the threshold from 3 to 5, not made context-aware','Verified in-browser: the note stays hidden through the 4th session start and appears from the 5th onward, before shipping'],status:'completed',completedAt:'2026-08-09'},
{id:'r13-copy-pass',panel:'work',title:'Copywriting pass on R13’s first-draft subtitle/hint text — shipped',source:'Senior design review 2026-07-28 · R13, shipped 2026-07-30. Copy tightened and shipped 2026-08-11.',description:'R13 added plain-language subtitles to HALT+/Urge Log and empty-state hints. The report flagged the wording as a first draft, not final copy. Tightened the HALT+ and Urge Log subtitles to cut jargon ("one-tap diagnostic", "tank executive function") and wordiness; Tasks/Notes empty-state hints were already tight and left as-is.',steps:['Pulled the current strings — HALT+/Urge Log subtitles, Tasks/Notes empty-state text','Tightened the wording together, confirmed with Joe before editing','Verified the new copy in-browser by rendering both modals directly (pre-login DOM check)','Shipped web-only (ad53ef2), confirmed live: SW stamp matches, config.js 200, site loads'],model:'Sonnet 5',effort:'Done',status:'completed',completedAt:'2026-08-11'},
{id:'app-store-submission-prep',panel:'recommendations',title:'Prep and submit the App Store Connect listing',source:'Based on your App Store direction decision — Persona panel 3, 2026-08-02. Updated 2026-08-09 after the legal doc suite (below) resolved most of the groundwork.',description:'Persona panel 3’s direction answer made the App Store the front door for launch. The compliance groundwork this needed is now done — the encryption-compliance key, the nutrition-label answers, and the Sign in with Apple question are all resolved. What’s left is the actual App Store Connect submission, which only you can do.',steps:['DONE — ITSAppUsesNonExemptEncryption=false confirmed present, and the sync script self-heals it if it’s ever missing','DONE — nutrition-label answers drafted from a real code audit in docs/legal/app-store-compliance.md §1 (Health & Fitness must be declared; Usage Data and Diagnostics are NOT linked to the user; no Tracking anywhere)','DONE — Sign in with Apple concern resolved as a non-issue: this app has no third-party login at all (see the "988-threshold"-style close-out on G-11 in COMPLIANCE-GAPS.md) — nothing to add before submitting','DONE — Privacy Policy URL exists and is live: centerpost.app/privacy (plus 4 companion docs)','Draft the listing: description, keywords, promotional text, screenshots per required device size','Enter the App Privacy answers from app-store-compliance.md §1 into App Store Connect’s nutrition-label UI','Enter centerpost.app/privacy as the Privacy Policy URL','Set the age rating honestly — flag the crisis-resource (988) and breathwork content in the questionnaire rather than answering as if this were a plain productivity app','Submit for review'],model:'Sonnet 5',effort:'Low-Medium now — the compliance research is done; what’s left is mostly you, in App Store Connect',status:'open',completedAt:null},
{id:'privacy-policy-page',panel:'work',title:'Legal & disclosure document suite — audited, published, and shipped to native',source:'Full session 2026-08-06 through 2026-08-09. Supersedes the original "Publish a privacy policy page" recommendation (Persona panel 3, 2026-08-02) — grew from one page into a full suite once the underlying data was actually audited.',description:'Code-first audit of every data flow in the app (Firestore, Worker KV, Sentry, SendGrid, HealthKit, Google Calendar) before writing a word of policy — found the product’s privacy story was already clean, but found 4 real gaps: prompt text was being logged for abuse detection, Firestore backup retention was unverified, an old audit had wrongly flagged Google Sign-In as a login method, and Google Calendar sync was never disclosed anywhere. All four fixed. Five public documents (privacy, consumer health data, terms, AI disclosure, medical/crisis disclaimer) are live at real routes, and Settings now has in-app links to them on native — confirmed working on a real device in TestFlight build 81.',steps:['Data audit + gap analysis — docs/legal/data-inventory.md, COMPLIANCE-GAPS.md','5 public documents drafted, matching Utah AI-disclosure and Washington MHMDA standards, not just generic boilerplate','Prompt-text logging fixed and deployed (Jarvis + Guardian workers) — only the matched pattern name is ever stored, never what you typed','Firestore backup retention confirmed at 98 days (the longer of PITR’s 7 days and the daily-backup schedule) and written into the policy honestly','Google Calendar sync — a real, undisclosed data flow found mid-review — now has its own privacy-policy section explaining the access plainly','Docs published live: centerpost.app/privacy, /health-privacy, /terms, /ai, /disclaimer, with the MHMDA-required separate homepage link to the health-data policy','Settings → About & Legal added on native, opening docs in an in-app Safari sheet (reused the app’s existing native bridge — no new Capacitor dependency)','Native build 81 shipped to TestFlight and confirmed on-device'],model:'Sonnet 5',effort:'Done',status:'completed',completedAt:'2026-08-09'},
{id:'legal-docs-attorney-review',panel:'recommendations',title:'Get the legal doc suite attorney-reviewed before relying on it publicly',source:'Legal & disclosure doc suite, 2026-08-06 through 2026-08-09',description:'Every document says plainly it was AI-drafted and not yet attorney-reviewed. That’s true and the docs are usable as-is for now, but five things in there are the kind an actual lawyer should sign off on before you’d want to lean on them in a dispute.',steps:['The arbitration clause + class-action waiver (Terms of Service §11) — enforceability and consumer-fairness rules vary by state and are actively litigated','Whether the "general wellness, not treatment" positioning holds up under FDA guidance given the DBT/CBT-derived tools plus urge logging plus mood inference','Washington MHMDA exposure specifically — it has a private right of action, the highest-dollar risk in the set','The Kids Mode COPPA framing (parent-operated account model) — the architecture is right, but a real opinion would be worth having','The liability cap (Terms §9) — standard language, but Indiana-specific enforceability for a wellness product is worth confirming'],model:null,effort:'Joe + outside counsel — not something I can do',status:'open',completedAt:null},
{id:'compliance-gaps-small-fixes',panel:'work',title:'Compliance gaps G-03, G-04, G-10 — closed',source:'COMPLIANCE-GAPS.md G-03 / G-04 / G-10, closed 2026-08-11',description:'Three small, independent, code-level items from the compliance audit. G-10 turned up a real finding along the way: the weather.gov/Overpass third-party calls it asked to document had actually been dead code since an earlier cleanup (commit 9b158e9) — that old code sent precise geolocation, not just IP, to both. Corrected the disclosure instead of documenting a flow that no longer exists.',steps:['G-03: navigator.globalPrivacyControl read on load, surfaced in Settings → About & Legal as an acknowledgement banner; privacy policy states GPC is recognized (web 6eaf8e4)','G-04: explicit tracking_settings (click/open/subscription/ganalytics all off) added to all 3 SendGrid mail/send payloads in centerpost-workers (guardian, sentinel, pulse); deployed via wrangler to all three Workers','G-10: found the weather.gov/Overpass code path was already removed (9b158e9) — grep-verified zero references left anywhere; removed the two stale CSP connect-src entries and corrected privacy-policy.md, privacy.html, and data-inventory.md instead of the originally-scoped \"confirm and document\" fix','Verified live: SW stamp matches, config.js 200, /privacy confirmed clean of weather.gov/Overpass + shows the new GPC paragraph, CSP header confirmed to no longer allow either domain'],model:'Sonnet 5',effort:'Done',status:'completed',completedAt:'2026-08-11'},
{id:'cross-device-deletion-cleanup',panel:'work',title:'G-05 — deleted-account data now purges itself on your other devices',source:'COMPLIANCE-GAPS.md G-05 — same bug shape as the cross-account localStorage leaks (a3f6c42, 2b1e21d). Closed 2026-08-11 (web 93c1896, jarvis worker bc15f5e).',description:'Deleting an account wiped the server and the device you deleted from, but a second signed-in device kept its localStorage mirror (check-ins, mood log, encrypted journal) indefinitely. Took the full code fix rather than the documented-caveat option, given this bug class had already bitten the app twice. Found and fixed a second gap along the way: the same-device wipe had silently drifted out of date and was never clearing check-ins, mood log, or the Axis profile — so those survived deletion even on the device you deleted from.',steps:['New POST /account/exists endpoint on the jarvis Worker — necessarily unauthenticated (the caller’s account is gone, so it has no token), origin-gated and IP rate-limited on the same bucket as Touch ID login','Client purge runs in the signed-out branch of onAuthStateChanged — exactly where a second device lands, because deleting an account revokes its refresh token','Fails closed in every direction: a 503, a thrown fetch, a malformed body, or an ordinary sign-out all purge nothing. Only an explicit {exists:false} deletes anything — a false “gone” would destroy a live user’s data','Same-device fix: cpCheckins_/cpMoodLog_/cpAxisProfile_ added to the wipe; both wipe paths now share one UID_SCOPED_LS_PREFIXES list so they can’t drift apart again','Verified: 5 client cases in-browser (happy path + 4 failure modes), then end-to-end against the deployed Worker — a live uid kept its data, a nonexistent uid was purged, the signed-out “local” scope untouched. Endpoint verified live (real uid→true, fake uid→false, 400 on missing uid, 403 on bad origin, /health unbroken)','Privacy policy §9 “other devices” caveat rewritten to match the new behavior'],model:'Sonnet 5',effort:'Done',status:'completed',completedAt:'2026-08-11'},
{id:'kids-take-meds-wording',panel:'work',title:'"Take meds" default chore item in Kids Mode — removed',source:'COMPLIANCE-GAPS.md G-06, closed 2026-08-16 (web 9d3b524)',description:'kids.html shipped a default "Take meds" 💊 checklist item for children — the one thing that pulled the parent-run chore tracker into health-data territory. The account architecture was already fine (parent-only account, child never logs in, no data ever reaches Centerpost per the 2026-08-11 G-06 closure) and the privacy policy already has a Family Features section — but it was still the one detail that could prompt a reviewer to ask. Removed outright rather than renamed or made opt-in.',steps:['Removed the m3 ("Take meds") entry from DEFAULT_ROUTINES.morning and the e4 entry from DEFAULT_ROUTINES.evening in kids.html','Grep-verified no other references to the removed item ids or the string "Take meds" remain in the file','Shipped web-only (9d3b524), verified live: SW stamp matches, config.js 200, page renders'],model:'Sonnet 5',effort:'Done',status:'completed',completedAt:'2026-08-16'},
{id:'native-touch-face-id',panel:'work',title:'Face ID/Touch ID sign-in on native (iPhone, iPad, and the Mac-hosted app) — shipped',source:'Follow-up to Touch ID sign-in (web/Mac browser), shipped 2026-08-05. Built and shipped 2026-08-18 — sign-in in build 90, enrollment in build 91. BOTH CONFIRMED ON DEVICE.',description:'Touch ID sign-in works in a Mac browser at centerpost.app — Settings → Touch ID sign-in. Native was a real gap, not a smaller version of the same fix: a WKWebView’s navigator.credentials calls never reach the system passkey UI, so the ceremony had to move into an actual native Swift call (AuthenticationServices). Two things planned for this turned out to be unnecessary, and both were the expensive parts. The capacitor.config.json origin change — written up here as "the one step with real blast radius" — is not needed at all: Apple matches the app’s bundle ID + Team ID against the apple-app-site-association file, and the WebView’s origin never enters that check, so capacitor://localhost stays exactly as it was and so does the Worker’s CORS allowlist. The backend needed zero changes rather than "barely any": RP_ID and ORIGIN were already centerpost.app, and the JSON the native path posts to /webauthn/login-verify was checked byte-for-byte against what the browser path produces and is identical. The credential is the same passkey either way — it lives in the iCloud Keychain — so one enrolled in Safari on the Mac should sign you in on the phone with nothing new to enrol.',steps:['DONE — Team ID: already in project.pbxproj as DEVELOPMENT_TEAM (CN383S6YZK), identical across all 14 targets. Never needed asking for; it is not a secret, and the AASA file publishes it deliberately','DONE — apple-app-site-association hosted at centerpost.app/.well-known/ with a webcredentials entry for app.centerpost.app. Needed a _headers rule forcing content-type application/json (the file is deliberately extensionless, so Pages would otherwise serve it as octet-stream and Apple’s validator rejects it). Verified live: 200 application/json','DONE — Associated Domains entitlement (webcredentials:centerpost.app) added to App.entitlements. All 14 targets use automatic signing, so Xcode registers the capability on the App ID itself — no developer-portal step','DONE — built a custom PasskeyBridge.swift rather than adopting capacitor-passkey: it avoids a third-party dependency on the auth path, needs no Capacitor plugin install, and mirrors the journal’s existing _bioRequest bridge over the same `notify` channel. Covers both assert (sign-in) and register (enrollment); register is shipped but not yet called, so enrolling from the phone later is a JS-only change','DROPPED — the capacitor.config.json server.hostname change. Not required, see the description. This removed the entire blast-radius audit that made this item expensive','DONE — native branch in signInWithTouchID, plus a fix to the sign-in button reveal: it gated on a localStorage enrolment hint that is a browser heuristic and is always empty on a fresh app install, even when a usable passkey is already in the Keychain. Button also relabels to "Face ID", which the markup hardcodes as "Touch ID"','DONE — CONFIRMED ON DEVICE, build 90. Off-device verification had got as far as it can: swiftc -typecheck clean against the iOS 15 SDK, and a stubbed-native-bridge browser test proving the request/reply shapes, the button relabel, the quiet-cancel path, and that web sign-in is untouched. The archived, signed app was also checked directly and does carry the webcredentials entitlement','DONE + CONFIRMED ON DEVICE (web d08aeb7, native build 91) — enrolling a NEW passkey directly on the phone. Both native hide-guards dropped (the loadTouchIDDevices early return and the waSettingsSection display:none), and the Settings copy, which the markup hardcodes for a Mac, is relabelled from the device plus the bridge’s reported biometry type: the phone reads Face ID and the Mac reads Touch ID. The device list works on native too — each enrolled device with its last use and a Remove button. Needed a SECOND build despite the Swift register op already shipping in 90, because the native app serves its bundled WWW/ and a web deploy never reaches it. Worth remembering: register-options returns its options at the TOP level where login-options nests them under .options, and handing the wrong one to the bridge fails as bad-challenge'],model:'Mixed — Sonnet for the research spike and client wiring, Opus for the entitlement and the native plugin (security-sensitive). In practice the blast-radius work priced into this never materialised',effort:'Was estimated High on the assumption of an origin change needing a real audit. Actual: Medium — the origin change was dropped and the backend was untouched, leaving a new entitlement, one self-contained Swift file, and a small JS branch. Still touches the App Store submission surface (new capability, new entitlement) that the incorporation decision gates',status:'completed',completedAt:'2026-08-18'}
];
var PANEL_LIST_IDS={recommendations:'list-recommendations',decisions:'list-decisions',work:'list-work'};
function itemRowHTML(item){
var isDone=item.status==='completed';
var footer='';
if(item.model||item.effort){
footer='<div class="item-footer">'+(item.model?'<span class="item-chip">Model: '+item.model+'</span>':'')+(item.effort?'<span class="item-chip">Effort: '+item.effort+'</span>':'')+'</div>';
}
var stepsHtml='';
for(var i=0;i<item.steps.length;i++){stepsHtml+='<li>'+item.steps[i]+'</li>';}
var badge=isDone?'<span class="item-completed-badge">✓ Completed '+item.completedAt+'</span>':'';
return '<details class="item'+(isDone?' completed':'')+'" id="item-'+item.id+'">'+
'<summary class="item-summary">'+
'<span class="item-chevron" aria-hidden="true"></span>'+
'<span class="item-title-wrap">'+
'<span class="item-title">'+item.title+'</span>'+
'<span class="item-source">'+item.source+'</span>'+
badge+
'</span>'+
'</summary>'+
'<div class="item-body">'+
'<p class="detail-text">'+item.description+'</p>'+
'<p class="detail-section-label">Steps</p>'+
'<ul class="detail-list">'+stepsHtml+'</ul>'+
footer+
'</div>'+
'</details>';
}
function renderPanel(panelKey){
var container=document.getElementById(PANEL_LIST_IDS[panelKey]);
var items=panelData.filter(function(it){return it.panel===panelKey;});
if(items.length===0){
container.innerHTML='<p class="panel-empty">Nothing here yet.</p>';
return;
}
var open=items.filter(function(it){return it.status!=='completed';});
var done=items.filter(function(it){return it.status==='completed';});
done.sort(function(a,b){return (b.completedAt||'').localeCompare(a.completedAt||'');});
var html=open.map(itemRowHTML).join('');
if(done.length){
html+='<p class="completed-divider">Completed</p>'+done.map(itemRowHTML).join('');
}
container.innerHTML=html;
}
function renderAllPanels(){
renderPanel('recommendations');
renderPanel('decisions');
renderPanel('work');
}
(async function boot(){
await requireOwner();
renderAllPanels();
})();
</script>
</body>
