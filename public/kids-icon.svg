<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Light blue rounded background -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a5e8ff"/>
      <stop offset="100%" stop-color="#5bc8ee"/>
    </linearGradient>
    <radialGradient id="starGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffe680"/>
      <stop offset="60%" stop-color="#ffcc00"/>
      <stop offset="100%" stop-color="#e6a800"/>
    </radialGradient>
    <filter id="starShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="6" result="offsetblur"/>
      <feFlood flood-color="#1a3a5f" flood-opacity="0.4"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background with rounded corners (iOS rounds these further automatically) -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>

  <!-- Subtle starfield decoration -->
  <circle cx="80" cy="100" r="3" fill="#fff" opacity="0.6"/>
  <circle cx="120" cy="80" r="2" fill="#fff" opacity="0.5"/>
  <circle cx="420" cy="120" r="3" fill="#fff" opacity="0.6"/>
  <circle cx="440" cy="80" r="2" fill="#fff" opacity="0.4"/>
  <circle cx="60" cy="420" r="2" fill="#fff" opacity="0.4"/>
  <circle cx="450" cy="430" r="3" fill="#fff" opacity="0.5"/>
  <circle cx="380" cy="450" r="2" fill="#fff" opacity="0.4"/>

  <!-- Main star (5-pointed, centered) -->
  <g filter="url(#starShadow)">
    <!-- Calculated star path: cx=256, cy=270, rOuter=170, rInner=72 -->
    <!-- Outer pts at -90, -18, 54, 126, 198 degrees; inner at -54, 18, 90, 162, 234 -->
    <path d="M 256 100 L 278.3 213.5 L 418.7 213.5 L 326.2 282.3 L 348.5 395.7 L 256 326.9 L 163.5 395.7 L 185.8 282.3 L 93.3 213.5 L 233.7 213.5 Z"
          fill="url(#starGrad)"
          stroke="#5c3d00"
          stroke-width="10"
          stroke-linejoin="round"/>
    <!-- Inner highlight -->
    <path d="M 256 145 L 271 220 L 350 220 L 295 260 L 310 335 L 256 295 L 202 335 L 217 260 L 162 220 L 241 220 Z"
          fill="none"
          stroke="#fff8d6"
          stroke-width="4"
          stroke-opacity="0.55"
          stroke-linejoin="round"/>
  </g>

  <!-- "KIDS" badge at bottom -->
  <g transform="translate(256, 458)">
    <rect x="-75" y="-22" width="150" height="40" rx="8" fill="#1a3a5f" stroke="#fff" stroke-width="3"/>
    <text x="0" y="6" text-anchor="middle" font-family="'Press Start 2P', 'Courier New', monospace" font-size="18" font-weight="700" fill="#ffcc00" letter-spacing="2">KIDS</text>
  </g>
</svg>
