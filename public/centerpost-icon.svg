<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- One gradient, reused by every element of the mark. userSpaceOnUse (not
         objectBoundingBox) so the ramp runs ONCE across the whole mark, top to
         bottom: y=84 is the top notch's outer edge, y=428 the bottom one's.
         With per-object units each spoke would get its own full ramp and the
         mark would not read as a single graded object. -->
    <linearGradient id="cpGrad" gradientUnits="userSpaceOnUse" x1="0" y1="84" x2="0" y2="428">
      <stop offset="0%" stop-color="#f2a63a"/>
      <stop offset="50%" stop-color="#ce2029"/>
      <stop offset="100%" stop-color="#8a1418"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="#1a1a1a"/>
  <g fill="none" stroke="url(#cpGrad)">
    <!-- Outer ring: r=150, stroke-width 20 -> band spans r=140..160 -->
    <circle cx="256" cy="256" r="150" stroke-width="20"/>
    <!-- 8 spokes, r=66 (cap edge +6) out to r=140 (the ring's INNER radius),
         so they meet the ring band without crossing into or past it. -->
    <g stroke-width="16" stroke-linecap="butt">
      <line x1="256" y1="190" x2="256" y2="116"/>
      <line x1="302.669" y1="209.331" x2="354.995" y2="157.005"/>
      <line x1="322" y1="256" x2="396" y2="256"/>
      <line x1="302.669" y1="302.669" x2="354.995" y2="354.995"/>
      <line x1="256" y1="322" x2="256" y2="396"/>
      <line x1="209.331" y1="302.669" x2="157.005" y2="354.995"/>
      <line x1="190" y1="256" x2="116" y2="256"/>
      <line x1="209.331" y1="209.331" x2="157.005" y2="157.005"/>
    </g>
  </g>
  <!-- N/E/S/W notches: 16x44, spanning r=128..172 so each straddles the ring
       band (inner edge inside the ring, outer edge beyond it). -->
  <g fill="url(#cpGrad)">
    <rect x="248" y="84"  width="16" height="44"/>
    <rect x="384" y="248" width="44" height="16"/>
    <rect x="248" y="384" width="16" height="44"/>
    <rect x="84"  y="248" width="44" height="16"/>
    <!-- Center cap, r=60 -->
    <circle cx="256" cy="256" r="60"/>
  </g>
  <!-- Center C: paint-order stroke thickens the glyph beyond Georgia Bold so it
       reads at weight 900 even where the 900 face is unavailable. -->
  <text x="256" y="292" font-family="Georgia,serif" font-size="104" font-weight="900"
        text-anchor="middle" fill="#1a1210" stroke="#1a1210" stroke-width="5"
        paint-order="stroke fill">C</text>
</svg>
