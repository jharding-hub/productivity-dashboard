<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a0033">
<title>Centerpost Kids</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════
   CENTERPOST KIDS — 32-pixel arcade theme
   ═══════════════════════════════════════════════════════════════════ */

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{font-size:16px;}
body{
  font-family:'VT323','Courier New',monospace;
  font-size:22px;
  line-height:1.3;
  color:var(--text);
  background:var(--bg);
  background-image:var(--bg-pattern);
  min-height:100vh;
  -webkit-font-smoothing:none;
  -moz-osx-font-smoothing:grayscale;
  image-rendering:pixelated;
  overflow-x:hidden;
}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;}
button{cursor:pointer;border:none;background:none;}

/* ── DEFAULT: RAINBOW ARCADE ── */
:root{
  --bg:#1a0033;
  --bg-pattern:radial-gradient(circle at 20% 30%,rgba(255,51,153,0.15) 0%,transparent 40%),radial-gradient(circle at 80% 70%,rgba(0,255,204,0.15) 0%,transparent 40%);
  --surface:#2d1b4e;
  --surface-light:#3d2966;
  --border:#ff3399;
  --border-dark:#990066;
  --primary:#ff3399;
  --secondary:#00ffcc;
  --accent:#ffcc00;
  --success:#66ff33;
  --danger:#ff3333;
  --text:#ffffff;
  --text-dim:#ccaaee;
  --shadow:#000033;
  --header-font:'Press Start 2P',monospace;
  --body-font:'VT323',monospace;
}

/* ── THEME: MAZE QUEST (Pac-Man inspired — yellow on midnight blue) ── */
body.theme-maze{
  --bg:#000033;
  --bg-pattern:radial-gradient(circle at 50% 50%,rgba(255,204,0,0.04) 1px,transparent 1px);
  background-size:24px 24px;
  --surface:#000066;
  --surface-light:#0000aa;
  --border:#ffcc00;
  --border-dark:#996600;
  --primary:#ffcc00;
  --secondary:#ff0066;
  --accent:#00ccff;
  --success:#ff6600;
  --danger:#ff0066;
  --text:#ffcc00;
  --text-dim:#ffee88;
  --shadow:#000011;
}
body.theme-maze{
  background-image:radial-gradient(circle at 50% 50%,rgba(255,204,0,0.18) 2px,transparent 2.5px);
  background-size:32px 32px;
}

/* ── THEME: SPEED HERO (Sonic-inspired — blue/green/gold) ── */
body.theme-speed{
  --bg:#0a3f9c;
  --bg-pattern:linear-gradient(180deg,#0a3f9c 0%,#1a5fcc 60%,#66cc00 60%,#3a9900 100%);
  --surface:#1a4faa;
  --surface-light:#2a6fcc;
  --border:#ffcc00;
  --border-dark:#cc9900;
  --primary:#00aaff;
  --secondary:#66ff33;
  --accent:#ffcc00;
  --success:#ffcc00;
  --danger:#ff0033;
  --text:#ffffff;
  --text-dim:#cce6ff;
  --shadow:#001144;
}

/* ── THEME: CRITTER COLLECTOR (Pokemon-inspired — red/white capsule) ── */
body.theme-critter{
  --bg:#f5f5f5;
  --bg-pattern:linear-gradient(180deg,#ee1515 0%,#ee1515 48%,#222 48%,#222 52%,#f5f5f5 52%,#f5f5f5 100%);
  --surface:#ffffff;
  --surface-light:#fafafa;
  --border:#222222;
  --border-dark:#000000;
  --primary:#ee1515;
  --secondary:#3b4cca;
  --accent:#ffcc00;
  --success:#3b9c3b;
  --danger:#ee1515;
  --text:#222222;
  --text-dim:#666666;
  --shadow:#999999;
}

/* ── THEME: CANDY POP — bubblegum pink/teal/yellow ── */
body.theme-candy{
  --bg:#fff0f9;
  --bg-pattern:radial-gradient(circle at 30% 20%,rgba(255,102,204,0.2) 0%,transparent 35%),radial-gradient(circle at 80% 60%,rgba(102,221,255,0.18) 0%,transparent 35%),radial-gradient(circle at 60% 90%,rgba(255,238,68,0.2) 0%,transparent 35%);
  --surface:#ffffff;
  --surface-light:#fff5fa;
  --border:#ff66cc;
  --border-dark:#cc3399;
  --primary:#ff66cc;
  --secondary:#66ddff;
  --accent:#ffee44;
  --success:#88ff66;
  --danger:#ff5577;
  --text:#4a0044;
  --text-dim:#aa6699;
  --shadow:#cc99bb;
}

/* ── THEME: LAVA WORLD — molten orange/red/yellow ── */
body.theme-lava{
  --bg:#220000;
  --bg-pattern:radial-gradient(circle at 20% 80%,rgba(255,102,0,0.3) 0%,transparent 50%),radial-gradient(circle at 80% 20%,rgba(255,204,0,0.2) 0%,transparent 50%),radial-gradient(circle at 50% 50%,rgba(255,0,51,0.1) 0%,transparent 60%);
  --surface:#440000;
  --surface-light:#660000;
  --border:#ffcc00;
  --border-dark:#aa6600;
  --primary:#ff6600;
  --secondary:#ffcc00;
  --accent:#ff0033;
  --success:#66ff33;
  --danger:#ff0033;
  --text:#ffeecc;
  --text-dim:#ddaa66;
  --shadow:#110000;
}

/* ═══ LAYOUT ═══ */
.app{
  max-width:1400px;
  margin:0 auto;
  padding:14px;
}

.header{
  background:var(--surface);
  border:4px solid var(--border);
  box-shadow:6px 6px 0 var(--shadow);
  padding:14px 18px;
  margin-bottom:18px;
  display:grid;
  grid-template-columns:auto 1fr auto;
  align-items:center;
  gap:18px;
  position:relative;
}
.header-logo{
  font-family:var(--header-font);
  font-size:14px;
  color:var(--primary);
  text-shadow:3px 3px 0 var(--shadow);
  letter-spacing:1px;
  line-height:1.4;
}
.header-logo .logo-kids{color:var(--accent);}
.header-stats{
  display:flex;
  gap:14px;
  justify-content:center;
  flex-wrap:wrap;
}
.stat-chip{
  background:var(--bg);
  border:3px solid var(--border);
  padding:8px 14px;
  display:flex;
  align-items:center;
  gap:8px;
  font-family:var(--header-font);
  font-size:12px;
  box-shadow:4px 4px 0 var(--shadow);
  min-width:90px;
  justify-content:center;
}
.stat-chip .stat-icon{font-size:20px;line-height:1;}
.stat-chip .stat-val{color:var(--accent);text-shadow:2px 2px 0 var(--shadow);}
.stat-chip.streak .stat-icon{filter:drop-shadow(0 0 4px var(--accent));}

.header-actions{display:flex;gap:8px;}
.icon-btn{
  width:42px;
  height:42px;
  background:var(--surface-light);
  border:3px solid var(--border);
  box-shadow:3px 3px 0 var(--shadow);
  font-size:22px;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:transform 0.08s ease;
}
.icon-btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--shadow);}
.icon-btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow);}

/* ═══ GRID ═══ */
.grid{
  display:grid;
  grid-template-columns:repeat(12,1fr);
  gap:18px;
}
@media(max-width:900px){.grid{grid-template-columns:repeat(6,1fr);}}
@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr);gap:14px;}}

.panel{
  background:var(--surface);
  border:4px solid var(--border);
  box-shadow:6px 6px 0 var(--shadow);
  padding:18px;
  position:relative;
  min-height:180px;
}
.panel-title{
  font-family:var(--header-font);
  font-size:13px;
  color:var(--accent);
  text-shadow:2px 2px 0 var(--shadow);
  letter-spacing:1px;
  margin-bottom:14px;
  display:flex;
  align-items:center;
  gap:10px;
}
.panel-title .panel-icon{font-size:22px;}
.panel-title .panel-count{
  margin-left:auto;
  font-size:11px;
  color:var(--text);
  background:var(--bg);
  border:2px solid var(--border);
  padding:3px 8px;
}

/* Span helpers */
.span-4{grid-column:span 4;}
.span-6{grid-column:span 6;}
.span-8{grid-column:span 8;}
.span-12{grid-column:span 12;}
@media(max-width:900px){
  .span-4,.span-6,.span-8{grid-column:span 6;}
  .span-12{grid-column:span 6;}
}
@media(max-width:600px){
  .span-4,.span-6,.span-8,.span-12{grid-column:span 2;}
}

/* ═══ TASKS PANEL ═══ */
.task-list{display:flex;flex-direction:column;gap:10px;}
.task-item{
  display:flex;
  align-items:center;
  gap:14px;
  background:var(--surface-light);
  border:3px solid var(--task-color,var(--primary));
  padding:14px 16px;
  box-shadow:4px 4px 0 var(--shadow);
  cursor:pointer;
  transition:transform 0.08s ease;
  font-size:24px;
  font-family:var(--body-font);
}
.task-item:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--shadow);}
.task-item:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow);}
.task-item.done{
  opacity:0.55;
  background:var(--bg);
}
.task-item.done .task-text{text-decoration:line-through;}
.task-check{
  width:32px;
  height:32px;
  border:3px solid currentColor;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  background:var(--bg);
}
.task-item.done .task-check{background:var(--success);color:var(--bg);}
.task-text{flex:1;line-height:1.2;}
.task-delete{
  font-size:18px;
  width:28px;
  height:28px;
  background:var(--danger);
  color:white;
  border:2px solid var(--shadow);
  display:flex;
  align-items:center;
  justify-content:center;
  line-height:1;
  font-weight:bold;
}

.add-row{
  display:flex;
  gap:8px;
  margin-top:14px;
}
.add-row input{
  flex:1;
  background:var(--bg);
  border:3px solid var(--border);
  color:var(--text);
  padding:10px 12px;
  font-size:20px;
  outline:none;
}
.add-row input:focus{border-color:var(--accent);}
.add-btn{
  background:var(--success);
  color:var(--bg);
  border:3px solid var(--shadow);
  padding:10px 18px;
  font-family:var(--header-font);
  font-size:13px;
  box-shadow:3px 3px 0 var(--shadow);
  transition:transform 0.08s;
}
.add-btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--shadow);}
.add-btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow);}

/* ═══ TIMER PANEL (big button mode) ═══ */
.timer-panel{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:14px;
}
.big-timer-btn{
  width:100%;
  aspect-ratio:1.4/1;
  min-height:200px;
  background:linear-gradient(180deg,var(--primary) 0%,var(--border-dark) 100%);
  border:5px solid var(--shadow);
  box-shadow:6px 6px 0 var(--shadow),inset 0 -8px 0 rgba(0,0,0,0.3),inset 0 8px 0 rgba(255,255,255,0.2);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  font-family:var(--header-font);
  color:var(--text);
  text-shadow:3px 3px 0 var(--shadow);
  transition:transform 0.08s ease;
  cursor:pointer;
  letter-spacing:1px;
}
.big-timer-btn:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--shadow),inset 0 -8px 0 rgba(0,0,0,0.3),inset 0 8px 0 rgba(255,255,255,0.2);}
.big-timer-btn:active{transform:translate(3px,3px);box-shadow:3px 3px 0 var(--shadow),inset 0 -8px 0 rgba(0,0,0,0.3),inset 0 8px 0 rgba(255,255,255,0.2);}
.big-timer-btn.running{background:linear-gradient(180deg,var(--success) 0%,#338811 100%);animation:timer-pulse 1s ease-in-out infinite;}
@keyframes timer-pulse{0%,100%{filter:brightness(1);}50%{filter:brightness(1.15);}}
.timer-icon{font-size:60px;line-height:1;margin-bottom:8px;}
.timer-display{font-size:36px;line-height:1;}
.timer-label{font-size:12px;margin-top:6px;opacity:0.85;}

.duration-row{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  justify-content:center;
}
.dur-chip{
  background:var(--surface-light);
  border:3px solid var(--border);
  color:var(--text);
  padding:6px 12px;
  font-family:var(--header-font);
  font-size:11px;
  cursor:pointer;
  transition:transform 0.08s;
}
.dur-chip:hover{transform:translateY(-1px);}
.dur-chip.active{background:var(--accent);color:var(--bg);border-color:var(--shadow);}

/* ═══ ROUTINES PANEL ═══ */
.routine-tabs{display:flex;gap:6px;margin-bottom:14px;}
.routine-tab{
  flex:1;
  background:var(--surface-light);
  border:3px solid var(--border);
  color:var(--text);
  padding:10px;
  font-family:var(--header-font);
  font-size:11px;
  cursor:pointer;
  box-shadow:3px 3px 0 var(--shadow);
}
.routine-tab.active{background:var(--accent);color:var(--bg);}
.routine-list{display:flex;flex-direction:column;gap:8px;}
.routine-item{
  display:flex;
  align-items:center;
  gap:14px;
  background:var(--surface-light);
  border:3px solid var(--border);
  padding:12px 14px;
  box-shadow:3px 3px 0 var(--shadow);
  cursor:pointer;
  font-size:22px;
  transition:transform 0.08s;
}
.routine-item:hover{transform:translate(-1px,-1px);}
.routine-item.done{opacity:0.55;background:var(--bg);}
.routine-item.done .routine-name{text-decoration:line-through;}
.routine-emoji{font-size:30px;line-height:1;}
.routine-name{flex:1;}
.routine-check{
  width:30px;
  height:30px;
  border:3px solid var(--success);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  background:var(--bg);
  flex-shrink:0;
}
.routine-item.done .routine-check{background:var(--success);color:var(--bg);}
.routine-earned{
  font-size:14px;
  margin-left:6px;
  display:inline-block;
  filter:drop-shadow(0 0 4px var(--accent));
  vertical-align:middle;
  opacity:0.85;
}
.routine-progress{
  margin-top:14px;
  background:var(--bg);
  border:3px solid var(--border);
  padding:10px;
  text-align:center;
  font-family:var(--header-font);
  font-size:11px;
}
.routine-progress-bar{
  margin-top:8px;
  background:var(--shadow);
  border:2px solid var(--border-dark);
  height:18px;
  position:relative;
  overflow:hidden;
}
.routine-progress-fill{
  background:var(--success);
  height:100%;
  transition:width 0.4s ease;
  background-image:repeating-linear-gradient(45deg,transparent,transparent 4px,rgba(255,255,255,0.2) 4px,rgba(255,255,255,0.2) 8px);
}

/* ═══ MUSIC PANEL ═══ */
.music-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.music-btn{
  background:var(--surface-light);
  border:3px solid var(--border);
  padding:18px 10px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  box-shadow:3px 3px 0 var(--shadow);
  font-family:var(--header-font);
  font-size:10px;
  color:var(--text);
  cursor:pointer;
  transition:transform 0.08s;
}
.music-btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--shadow);}
.music-btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow);}
.music-btn.playing{background:var(--success);color:var(--bg);animation:music-bump 0.6s ease-in-out infinite;}
@keyframes music-bump{0%,100%{transform:scale(1);}50%{transform:scale(1.04);}}
.music-icon{font-size:36px;line-height:1;}
.music-stop-btn{
  grid-column:span 2;
  background:var(--danger);
  color:white;
  border:3px solid var(--shadow);
  padding:10px;
  font-family:var(--header-font);
  font-size:11px;
  box-shadow:3px 3px 0 var(--shadow);
  display:none;
}
.music-stop-btn.show{display:block;}

/* ═══ BREATHWORK PANEL ═══ */
.breath-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.breath-btn{
  background:var(--surface-light);
  border:3px solid var(--border);
  padding:20px 14px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
  box-shadow:3px 3px 0 var(--shadow);
  font-family:var(--header-font);
  font-size:11px;
  color:var(--text);
  cursor:pointer;
}
.breath-btn:hover{transform:translate(-1px,-1px);}
.breath-btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow);}
.breath-icon{font-size:44px;}

/* Breathwork modal */
.breath-modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.85);
  z-index:200;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.breath-modal.open{display:flex;}
.breath-stage{
  text-align:center;
  color:white;
  width:100%;
  max-width:500px;
}
.breath-circle{
  width:240px;
  height:240px;
  margin:0 auto 28px;
  background:radial-gradient(circle,var(--accent) 0%,var(--primary) 100%);
  border:5px solid var(--shadow);
  border-radius:50%;
  transform:scale(0.5);
  transition:transform var(--breath-dur,4s) ease-in-out;
  box-shadow:0 0 80px var(--primary);
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:var(--header-font);
  font-size:18px;
  color:var(--bg);
  text-shadow:2px 2px 0 var(--accent);
}
.breath-circle.expanded{transform:scale(1.05);}
.breath-instr{
  font-family:var(--header-font);
  font-size:18px;
  color:var(--accent);
  text-shadow:3px 3px 0 var(--shadow);
  margin-bottom:14px;
  letter-spacing:2px;
}
.breath-count{
  font-family:var(--header-font);
  font-size:48px;
  color:var(--text);
  text-shadow:4px 4px 0 var(--shadow);
  margin-bottom:24px;
}
.breath-stop{
  background:var(--danger);
  color:white;
  border:3px solid var(--shadow);
  padding:12px 24px;
  font-family:var(--header-font);
  font-size:13px;
  box-shadow:4px 4px 0 var(--shadow);
}

/* ═══ READING LIST PANEL ═══ */
.book-list{display:flex;flex-direction:column;gap:10px;margin-bottom:12px;}
.book-item{
  display:flex;
  align-items:center;
  gap:12px;
  background:var(--surface-light);
  border:3px solid var(--book-color,var(--secondary));
  padding:12px 14px;
  box-shadow:4px 4px 0 var(--shadow);
  font-size:22px;
  font-family:var(--body-font);
}
.book-emoji{font-size:30px;line-height:1;flex-shrink:0;}
.book-title{flex:1;line-height:1.2;word-break:break-word;}
.book-done-btn{
  background:var(--success);
  color:var(--bg);
  border:3px solid var(--shadow);
  padding:8px 14px;
  font-family:var(--header-font);
  font-size:11px;
  box-shadow:3px 3px 0 var(--shadow);
  cursor:pointer;
  flex-shrink:0;
  transition:transform 0.08s;
}
.book-done-btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--shadow);}
.book-done-btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow);}
.book-empty{
  text-align:center;
  padding:20px 8px;
  font-size:20px;
  color:var(--text-dim);
  font-style:italic;
}
.book-stats{
  background:var(--bg);
  border:3px solid var(--border);
  padding:10px 14px;
  text-align:center;
  font-family:var(--header-font);
  font-size:11px;
  color:var(--accent);
  margin-bottom:12px;
  text-shadow:1px 1px 0 var(--shadow);
}
.book-stats .book-stat-icon{font-size:14px;}
.book-stats .completed-titles{
  display:block;
  margin-top:6px;
  font-family:var(--body-font);
  font-size:16px;
  color:var(--text-dim);
  text-shadow:none;
  font-style:italic;
  line-height:1.3;
}
.book-points-hint{
  font-size:14px;
  color:var(--text-dim);
  text-align:center;
  margin-bottom:8px;
  font-style:italic;
}

/* ═══ THOUGHT BUBBLES PANEL ═══ */
.bubble-area{
  background:var(--bg);
  border:3px solid var(--border);
  min-height:120px;
  padding:12px;
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:12px;
  max-height:280px;
  overflow-y:auto;
}
.bubble-area:empty::before{
  content:'no thoughts yet — type one below!';
  color:var(--text-dim);
  font-style:italic;
  font-size:18px;
}
.thought-bubble{
  background:var(--bubble-color,var(--primary));
  color:#0a0014;
  padding:8px 14px;

      return Object.assign({},DEFAULT_STATE,loaded,{
        rewards:Object.assign({},DEFAULT_STATE.rewards,loaded.rewards||{}),
        routines:loaded.routines||JSON.parse(JSON.stringify(DEFAULT_ROUTINES)),
        reading:Object.assign({current:[],completed:[]},loaded.reading||{}),
        breathLastDate:Object.assign({calm:null,ready:null},loaded.breathLastDate||{})
      });
    }
  }catch(e){console.warn('state load failed',e);}
  return JSON.parse(JSON.stringify(DEFAULT_STATE));
}

function pad(n){return n<10?'0'+n:''+n;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}

function confetti(count){

  var emojis=['⭐','🎉','✨','🏆','💫','🎊','🌟','💎'];
  for(var i=0;i<count;i++){

    state.routines.morning.forEach(function(r){r.done=false;});
    state.routines.evening.forEach(function(r){r.done=false;});

  r.done=!r.done;

// ═══ STREAK + POINTS ═══
function awardPoints(n){
  state.points+=n;
  state.lifetimePoints+=n;
  save();
  updateHeader();
}
function updateHeader(){
  document.getElementById('streakDisplay').textContent=state.streak;
  document.getElementById('pointsDisplay').textContent=state.points;
}
function checkStreakProgress(){
  // Award a streak day if BOTH morning and evening routines are fully complete today
  var allMorning=state.routines.morning.every(function(r){return r.done;});
  var allEvening=state.routines.evening.every(function(r){return r.done;});
  if(allMorning&&allEvening){
    var today=todayStr();
    if(state.lastStreakDate!==today){
      // Compute yesterday from today (defensive against tz edge cases)
      var parts=today.split('-');
      var d=new Date(parseInt(parts[0]),parseInt(parts[1])-1,parseInt(parts[2]));
      d.setDate(d.getDate()-1);
      var ystr=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
      if(state.lastStreakDate===ystr||state.lastStreakDate===null){
        state.streak+=1;
      } else {
        state.streak=1;
      }
      state.lastStreakDate=today;
      if(state.streak>state.longestStreak)state.longestStreak=state.streak;
      save();
      updateHeader();
      checkRewardUnlocks();
      confetti(50);
      toast('🔥 '+state.streak+'-day streak!',3000);
    }
  }
}

function checkRewardUnlocks(){
  // Unlock 3-day reward every time we cross a multiple of 3
  var threeDayMilestones=Math.floor(state.streak/3);
  var sevenDayMilestones=Math.floor(state.streak/7);
  var totalThreeUnlocked=(state.rewards.history||[]).filter(function(h){return h.type==='3day';}).length+state.rewards.pendingThreeDay;
  var totalSevenUnlocked=(state.rewards.history||[]).filter(function(h){return h.type==='7day';}).length+state.rewards.pendingSevenDay;
  if(threeDayMilestones>totalThreeUnlocked){
    state.rewards.pendingThreeDay+=1;
    save();
    setTimeout(function(){openRewardModal('3day');},500);
  }
  if(sevenDayMilestones>totalSevenUnlocked){
    state.rewards.pendingSevenDay+=1;
    save();
    setTimeout(function(){openRewardModal('7day');},800);
  }
  renderRewards();
}

function renderRewards(){
  var pct3=Math.min(100,(state.streak%3)/3*100);if(state.streak>0&&state.streak%3===0)pct3=100;
  var pct7=Math.min(100,(state.streak%7)/7*100);if(state.streak>0&&state.streak%7===0)pct7=100;
  var progress3=state.streak%3===0&&state.streak>0?'3/3':((state.streak%3)+'/3');
  var progress7=state.streak%7===0&&state.streak>0?'7/7':((state.streak%7)+'/7');
  document.getElementById('reward3Progress').textContent=progress3;
  document.getElementById('reward7Progress').textContent=progress7;
  var t3=document.getElementById('reward3Tier');
  var t7=document.getElementById('reward7Tier');
  if(state.rewards.pendingThreeDay>0){
    t3.classList.add('unlocked');
    document.getElementById('reward3Status').innerHTML='UNLOCKED!<br><button class="claim-btn" onclick="openRewardModal(\'3day\')">CLAIM</button>';
  }else{
    t3.classList.remove('unlocked');
    document.getElementById('reward3Status').textContent=state.streak%3===0&&state.streak>0?'claimed!':(3-(state.streak%3))+' more days';
  }
  if(state.rewards.pendingSevenDay>0){
    t7.classList.add('unlocked');
    document.getElementById('reward7Status').innerHTML='UNLOCKED!<br><button class="claim-btn" onclick="openRewardModal(\'7day\')">CLAIM</button>';
  }else{
    t7.classList.remove('unlocked');
    document.getElementById('reward7Status').textContent=state.streak%7===0&&state.streak>0?'claimed!':(7-(state.streak%7))+' more days';
  }
}

// ═══ MUSIC / AMBIENT SOUNDS (Web Audio) ═══
function getAudioCtx(){
  if(!_audioCtx){_audioCtx=new (window.AudioContext||window.webkitAudioContext)();}
  if(_audioCtx.state==='suspended')_audioCtx.resume();
  return _audioCtx;
}
function makeNoise(ctx,type){
  // type: 'white','pink','brown'
  var bufferSize=2*ctx.sampleRate;
  var buffer=ctx.createBuffer(1,bufferSize,ctx.sampleRate);
  var data=buffer.getChannelData(0);
  if(type==='white'){
    for(var i=0;i<bufferSize;i++)data[i]=Math.random()*2-1;
  }else if(type==='pink'){
    var b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
    for(var i=0;i<bufferSize;i++){
      var white=Math.random()*2-1;
      b0=0.99886*b0+white*0.0555179;
      b1=0.99332*b1+white*0.0750759;
      b2=0.96900*b2+white*0.1538520;
      b3=0.86650*b3+white*0.3104856;
      b4=0.55000*b4+white*0.5329522;
      b5=-0.7616*b5-white*0.0168980;
      data[i]=(b0+b1+b2+b3+b4+b5+b6+white*0.5362)*0.11;
      b6=white*0.115926;
    }
  }else if(type==='brown'){
    var last=0;
    for(var i=0;i<bufferSize;i++){
      var white=Math.random()*2-1;
      last=(last+(0.02*white))/1.02;
      data[i]=last*3.5;
    }
  }
  var src=ctx.createBufferSource();
  src.buffer=buffer;
  src.loop=true;
  return src;
}
function toggleSound(kind){
  if(_activeSounds[kind]){
    stopSound(kind);
    return;
  }
  // stop other sounds first (one at a time)
  stopAllSounds(true);
  var ctx=getAudioCtx();
  var gain=ctx.createGain();
  gain.gain.value=0;
  gain.connect(ctx.destination);
  gain.gain.linearRampToValueAtTime(0.2,ctx.currentTime+0.4);
  var nodes={gain:gain,extra:[]};
  if(kind==='calm'){
    // Brown noise (ocean-like)
    var n=makeNoise(ctx,'brown');
    var filter=ctx.createBiquadFilter();
    filter.type='lowpass';filter.frequency.value=600;
    n.connect(filter);filter.connect(gain);
    n.start();nodes.source=n;nodes.extra.push(filter);
  }else if(kind==='focus'){
    // Pink noise (gentle hum)
    var n=makeNoise(ctx,'pink');
    var filter=ctx.createBiquadFilter();
    filter.type='lowpass';filter.frequency.value=2000;
    n.connect(filter);filter.connect(gain);
    n.start();nodes.source=n;nodes.extra.push(filter);
  }else if(kind==='fun'){
    // Cheerful arpeggio loop
    var notes=[261.63,329.63,392.00,523.25];
    var idx=0;
    var lfo=setInterval(function(){
      if(!_activeSounds[kind])return;
      var osc=ctx.createOscillator();
      var g=ctx.createGain();
      osc.type='square';
      osc.frequency.value=notes[idx%notes.length];
      osc.connect(g);g.connect(gain);
      var t=ctx.currentTime;
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(0.06,t+0.02);
      g.gain.linearRampToValueAtTime(0,t+0.28);
      osc.start(t);osc.stop(t+0.3);
      idx++;
    },350);
    nodes.lfo=lfo;
  }else if(kind==='rain'){
    // White noise + filter sweeps
    var n=makeNoise(ctx,'white');
    var filter=ctx.createBiquadFilter();
    filter.type='lowpass';filter.frequency.value=1200;
    n.connect(filter);filter.connect(gain);
    n.start();nodes.source=n;nodes.extra.push(filter);
  }
  _activeSounds[kind]=nodes;
  document.querySelectorAll('.music-btn').forEach(function(el){
    el.classList.toggle('playing',el.dataset.sound===kind);
  });
  document.getElementById('musicStopBtn').classList.add('show');
}
function stopSound(kind){
  var nodes=_activeSounds[kind];
  if(!nodes)return;
  try{
    var ctx=getAudioCtx();
    nodes.gain.gain.linearRampToValueAtTime(0,ctx.currentTime+0.2);
    if(nodes.source){setTimeout(function(){try{nodes.source.stop();}catch(e){}},250);}
    if(nodes.lfo)clearInterval(nodes.lfo);
  }catch(e){}
  delete _activeSounds[kind];
  document.querySelectorAll('.music-btn').forEach(function(el){
    if(el.dataset.sound===kind)el.classList.remove('playing');
  });
  if(Object.keys(_activeSounds).length===0){
    document.getElementById('musicStopBtn').classList.remove('show');
  }
}
function stopAllSounds(silent){
  Object.keys(_activeSounds).forEach(stopSound);
  if(!silent)toast('Sounds off');
}

// ═══ BREATHWORK ═══
var BREATH_PATTERNS={
  calm:[{phase:'BREATHE IN',dur:4,scale:'expanded'},{phase:'HOLD',dur:7,scale:'expanded'},{phase:'BREATHE OUT',dur:8,scale:'normal'}],
  ready:[{phase:'BREATHE IN',dur:4,scale:'expanded'},{phase:'HOLD',dur:4,scale:'expanded'},{phase:'BREATHE OUT',dur:4,scale:'normal'},{phase:'HOLD',dur:4,scale:'normal'}]
};
var _activeBreathPattern=null;
function startBreath(kind){
  var pattern=BREATH_PATTERNS[kind];
  if(!pattern)return;
  _activeBreathPattern=kind;
  document.getElementById('breathModal').classList.add('open');
  var idx=0,count=pattern[0].dur,phase=0;
  var circle=document.getElementById('breathCircle');
  var instr=document.getElementById('breathInstr');
  var countEl=document.getElementById('breathCount');
  function tick(){
    var step=pattern[phase];
    instr.textContent=step.phase;
    countEl.textContent=count;
    circle.style.setProperty('--breath-dur',step.dur+'s');
    if(count===step.dur){
      // start of phase — transition circle
      circle.classList.toggle('expanded',step.scale==='expanded');
    }
    count--;
    if(count<0){
      phase=(phase+1)%pattern.length;
      count=pattern[phase].dur-1;
      var step2=pattern[phase];
      circle.style.setProperty('--breath-dur',step2.dur+'s');
      circle.classList.toggle('expanded',step2.scale==='expanded');
      instr.textContent=step2.phase;
      countEl.textContent=step2.dur;
    }
  }
  tick();
  _breathInterval=setInterval(tick,1000);
}
function stopBreath(){
  clearInterval(_breathInterval);
  _breathInterval=null;
  document.getElementById('breathModal').classList.remove('open');
  // One award per day per pattern — prevents farming by repeated start/stop
  var today=todayStr();
  if(_activeBreathPattern && state.breathLastDate[_activeBreathPattern]!==today){
    state.breathLastDate[_activeBreathPattern]=today;
    save();
    awardPoints(3);
    toast('Nice breathing! +3 stars');
  } else {
    toast('Nice breathing!');
  }
  _activeBreathPattern=null;
}

}

function completeBook(id){
  var idx=state.reading.current.findIndex(function(b){return b.id===id;});
  if(idx<0)return;
  var book=state.reading.current[idx];
  // Move to completed list
  state.reading.completed.unshift({
    id:book.id,
    title:book.title,
    addedDate:book.addedDate,
    completedDate:todayStr()
  });
  // Keep last 50 completed in history (UI shows a count regardless)
  if(state.reading.completed.length>50)state.reading.completed=state.reading.completed.slice(0,50);
  state.reading.current.splice(idx,1);
  save();
  awardPoints(25);
  confetti(70);
  toast('🎉 You finished "'+book.title+'"! +25 stars',3500);
  renderReading();
}

function removeBook(id){
  // Quiet remove without celebration (e.g. typo, wrong title)
  state.reading.current=state.reading.current.filter(function(b){return b.id!==id;});
  save();
  renderReading();
}

function renderReading(){
  var listEl=document.getElementById('bookList');
  var current=state.reading.current||[];
  var completed=state.reading.completed||[];
  document.getElementById('bookCount').textContent=current.length;

  // Stats line — "N BOOKS FINISHED" + last few titles for motivation
  var statsEl=document.getElementById('bookStats');
  var lastTitles=completed.slice(0,3).map(function(b){return b.title;}).join(' • ');
  var statsHTML='<span class="book-stat-icon">🏅</span> '+completed.length+' BOOK'+(completed.length===1?'':'S')+' FINISHED';
  if(lastTitles){
    statsHTML+='<span class="completed-titles">recently: '+escapeHtml(lastTitles)+'</span>';
  }
  statsEl.innerHTML=statsHTML;

  if(current.length===0){
    listEl.innerHTML='<div class="book-empty">add a book you\'re reading below!</div>';
    return;
  }
  listEl.innerHTML=current.map(function(b){
    return '<div class="book-item" style="--book-color:'+b.color+';border-color:'+b.color+';">'
      +'<span class="book-emoji">📖</span>'
      +'<span class="book-title">'+escapeHtml(b.title)+'</span>'
      +'<button class="book-done-btn" onclick="completeBook(\''+b.id+'\')">DONE!</button>'
      +'</div>';
  }).join('');
}

// ═══ PARENT SETTINGS ═══
function openParentGate(){
  var body=document.getElementById('parentModalBody');
  body.innerHTML='<div class="pin-prompt">'
    +'<p style="font-size:20px;margin-bottom:14px;">Enter parent PIN:</p>'
    +'<input class="parent-input" id="pinInput" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autofocus>'
    +'<div class="parent-actions"><button class="parent-btn primary" onclick="checkPin()">UNLOCK</button></div>'
    +'<p style="font-size:14px;color:var(--text-dim);margin-top:14px;">(Default: 1234 — change it in settings)</p>'
    +'</div>';
  document.getElementById('parentModalTitle').textContent='PARENT GATE';
  document.getElementById('parentModal').classList.add('open');
  setTimeout(function(){
    var pin=document.getElementById('pinInput');
    if(pin){pin.focus();pin.addEventListener('keydown',function(e){if(e.key==='Enter')checkPin();});}
  },100);
}
function checkPin(){
  var pin=document.getElementById('pinInput').value;
  if(pin===state.parentPin){renderParentSettings();}
  else{toast('Wrong PIN');}
}
function renderParentSettings(){
  document.getElementById('parentModalTitle').textContent='PARENT SETTINGS';
  var body=document.getElementById('parentModalBody');
  body.innerHTML=
    '<h3>3-DAY REWARDS</h3>'
    +'<div class="parent-reward-list" id="threeDayList"></div>'
    +'<button class="parent-btn" onclick="addReward(\'3day\')">+ Add 3-day reward</button>'
    +'<h3>7-DAY REWARDS</h3>'
    +'<div class="parent-reward-list" id="sevenDayList"></div>'
    +'<button class="parent-btn" onclick="addReward(\'7day\')">+ Add 7-day reward</button>'
    +'<h3>STREAK</h3>'
    +'<div style="font-size:20px;margin-bottom:10px;">Current: '+state.streak+' days<br>Longest: '+state.longestStreak+' days<br>Books finished: '+((state.reading&&state.reading.completed)?state.reading.completed.length:0)+'<br>Lifetime stars: '+state.lifetimePoints+'</div>'
    +'<button class="parent-btn" onclick="resetStreak()">Reset streak to 0</button>'
    +'<h3>PIN</h3>'
    +'<input class="parent-input" type="text" id="newPin" placeholder="New PIN (numbers)" inputmode="numeric" maxlength="6" value="'+state.parentPin+'">'
    +'<button class="parent-btn" onclick="updatePin()">Save PIN</button>'
    +'<h3>DANGER ZONE</h3>'
    +'<button class="parent-btn danger" onclick="resetAllData()">Reset all kid data</button>';
  renderParentRewards();
}
function renderParentRewards(){
  var list3=document.getElementById('threeDayList');
  if(list3){
    list3.innerHTML=state.rewards.threeDayList.map(function(r,i){
      return '<div class="parent-reward-row"><input type="text" value="'+escapeHtml(r)+'" oninput="editReward(\'3day\','+i+',this.value)"><button onclick="removeReward(\'3day\','+i+')">×</button></div>';
    }).join('');
  }
  var list7=document.getElementById('sevenDayList');
  if(list7){
    list7.innerHTML=state.rewards.sevenDayList.map(function(r,i){
      return '<div class="parent-reward-row"><input type="text" value="'+escapeHtml(r)+'" oninput="editReward(\'7day\','+i+',this.value)"><button onclick="removeReward(\'7day\','+i+')">×</button></div>';
    }).join('');
  }
}
function editReward(tier,idx,val){
  if(tier==='3day')state.rewards.threeDayList[idx]=val;
  else state.rewards.sevenDayList[idx]=val;
  save();
}
function addReward(tier){
  if(tier==='3day')state.rewards.threeDayList.push('New reward');
  else state.rewards.sevenDayList.push('New reward');
  save();
  renderParentRewards();
}
function removeReward(tier,idx){
  if(tier==='3day')state.rewards.threeDayList.splice(idx,1);
  else state.rewards.sevenDayList.splice(idx,1);
  save();
  renderParentRewards();
}
function updatePin(){
  var v=document.getElementById('newPin').value.trim();
  if(!/^\d{4,6}$/.test(v)){toast('PIN must be 4–6 digits');return;}
  state.parentPin=v;save();toast('PIN updated');
}
function resetStreak(){
  if(!confirm('Reset streak to 0? (rewards stay)'))return;
  state.streak=0;state.lastStreakDate=null;save();updateHeader();renderRewards();toast('Streak reset');
}
function resetAllData(){
  if(!confirm('Erase EVERYTHING for this kid? This cannot be undone.'))return;
  if(!confirm('Really sure? All tasks, routines, streaks, and rewards will be deleted.'))return;
  localStorage.removeItem('centerpost_kids_state');
  location.reload();
}
function closeParentModal(){document.getElementById('parentModal').classList.remove('open');}

// ═══ INITIALIZATION ═══
function migrateLegacyState(){
  // Existing tasks pre-anti-farm fix: mark done tasks as already awarded so
  // they can't farm by unchecking and rechecking
  (state.tasks||[]).forEach(function(t){
    if(t.pointsAwarded===undefined)t.pointsAwarded=!!t.done;
  });
  // Existing routine items: if currently done AND today is the routine date,
  // assume they already earned today's point — prevents re-award by toggling
  var today=todayStr();
  ['morning','evening'].forEach(function(slot){
    (state.routines[slot]||[]).forEach(function(r){
      if(r.lastPointDate===undefined && r.done && state.routineDate===today){
        r.lastPointDate=today;
      }
    });
  });
  save();
}

function init(){
  migrateLegacyState();
  applyTheme(state.theme||'rainbow');
  switchRoutine(state.activeRoutineTab||'morning');
  renderTasks();
  renderBubbles();
  renderReading();
  renderRewards();
  updateHeader();
  setDuration(state.timerDuration||15);
  _timerRemaining=(state.timerDuration||15)*60;
  updateTimerDisplay();
}
init();

// Save state on unload (defensive)
window.addEventListener('beforeunload',save);

// Pause sounds + timer if tab hidden (be kind to battery)
document.addEventListener('visibilitychange',function(){
  if(document.hidden){
    if(_timerRunning)pauseTimer();
  }
});
</script>
</body>
